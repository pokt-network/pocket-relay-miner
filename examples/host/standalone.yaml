# Standalone-mode config for the host example (binary + systemd): the relayer
# and the miner in one process, their state in an embedded store, no Redis,
# pointed at the beta testnet. Installed as
# /etc/pocket-relay-miner/standalone.yaml for pocket-relay-miner-standalone.service.
# The high-availability example uses relayer.yaml and miner.yaml instead.
#
# Minimal on purpose: every key not set here takes its default. The common
# sections are written once at the top level; relayer: and miner: hold the
# keys only that side reads, with the same meaning and defaults as in
# config.relayer.example.yaml and config.miner.example.yaml. Check it before
# starting it with:
#   pocket-relay-miner standalone validate --config <file>
#
# Mainnet: switch every value marked "Mainnet:" below.

# The chain node both sides read from, and the miner submits claims and proofs
# to. These are the public Sauron endpoints; your own full node is the better
# choice for claims and proofs you are paid for.
pocket_node:
  # CometBFT RPC: blocks, and transaction submission.
  # Mainnet: "https://sauron-rpc.infra.pocket.network"
  query_node_rpc_url: "https://sauron-rpc.beta.infra.pocket.network"
  # gRPC: chain queries (params, sessions, suppliers), as host:port.
  # Mainnet: "sauron-grpc.infra.pocket.network:443"
  query_node_grpc_url: "sauron-grpc.beta.infra.pocket.network:443"
  # The miner refuses to start if the node reports a different chain id.
  # Mainnet: "pocket"
  chain_id: "pocket-lego-testnet"
  # TLS gRPC (port 443). true only for a plain-text node.
  grpc_insecure: false

# The suppliers this process signs for, claims and proves for.
keys:
  keys_file: "/etc/pocket-relay-miner/supplier-keys.yaml"

# The embedded store: everything the process keeps. The unit's StateDirectory
# creates this directory for the service user; keep it on local disk. New work
# stops when that disk has less than 1 GiB free.
storage:
  path: "/var/lib/pocket-relay-miner/data"

# Prometheus metrics of both sides, and GET /health for the container
# healthcheck.
metrics:
  enabled: true
  addr: "127.0.0.1:9092"

# Log level and format; logs go to stderr.
logging:
  level: "info"
  format: "json"

relayer:
  # Address the relay server listens on (relay traffic from gateways).
  listen_addr: "0.0.0.0:8080"

  # Services this relayer serves, keyed by on-chain service id. A relay for a
  # service that is not listed here is rejected. Add one entry per service
  # your suppliers are staked for; `validate --check-stake` lists any you miss.
  services:
    # CHANGE: the on-chain service id your supplier is staked for.
    my-service:
      # eager: validate the relay (signature, session) before forwarding it.
      validation_mode: eager
      # Backend used when the relay does not name a transport.
      default_backend: jsonrpc
      # Backends keyed by transport: jsonrpc | rest | websocket | grpc | cometbft.
      backends:
        jsonrpc:
          # CHANGE: the URL of the backend node that answers this service.
          url: "http://127.0.0.1:8545"
          # Active health check: strongly recommended on every HTTP backend
          # (jsonrpc, rest, cometbft); never on websocket or grpc, where the
          # HTTP probe always fails. Without it a dead backend is found only
          # by failing real relays. CHANGE the probe to one your node answers:
          # this one is for an EVM JSON-RPC node.
          # docs/deploy/README.md, "Backend health checks".
          health_check:
            enabled: true
            endpoint: "/"
            method: "POST"
            request_body: '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}'
            expected_body: '"result"'
            interval_seconds: 10
            timeout_seconds: 5
            unhealthy_threshold: 3
            healthy_threshold: 2

  # Health server: GET /ready answers 200 once the relayer can serve relays.
  health_check:
    enabled: true
    addr: "127.0.0.1:8081"

miner:
  # Expected seconds per block. Must match the chain: beta commits a block
  # about every 30 seconds.
  # Mainnet: 60 (about 61 seconds per block)
  block_time_seconds: 30
