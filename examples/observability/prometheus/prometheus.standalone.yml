# Scrapes the standalone-mode process of the compose example: one target that
# serves both sides' metrics. The high-availability stack uses prometheus.yml.
# On a host deployment, replace the target with 127.0.0.1:9092.
#
# One job, scraped once. The dashboards sum the ha_* series without selecting a
# job, so the same process scraped under two jobs would count every relay,
# claim and byte twice. The process panels select job=~"relayers|miners|standalone".
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: standalone
    static_configs:
      - targets: ["standalone:9092"]
        labels:
          instance: standalone
