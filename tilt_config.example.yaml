# tilt_config.example.yaml — the TRACKED reference for the Tilt config.
#
# `tilt_config.yaml` is gitignored (.gitignore:8), so values tuned on the
# machine are lost on a clone. This file is the copy that DOES travel with
# the repo: copy it to `tilt_config.yaml` and adjust what is yours.
#
#     cp tilt_config.example.yaml tilt_config.yaml
#
# Everything here is LOCALNET (local genesis addresses, simulation pubkeys,
# internal cluster URLs). No operator data goes in: real hostnames, public
# IPs or ssh aliases stay out, in the gitignored file.
#
# The Redis memory values (`redis:` section) are NOT arbitrary: they come
# from a measurement on 2026-09-16, and its rationale sits next to each one.

# Tilt Development Configuration for Pocket RelayMiner
# Edit this file to customize your local development environment.
# This includes the full configuration from example files with k8s service names.

backend:
  enabled: true
  grpc_port: 50051
  metrics_port: 9095
  port: 8545
global:
  debug: true
  image: pocket-relay-miner
miner:
  config:
    # keys_file | keyring -- mutually exclusive; see tilt/k8s/utils.Tiltfile
    key_source: keys_file
    # test | file -- only read when key_source is keyring. "file" is
    # passphrase-protected and is what production uses.
    keyring_backend: test
    balance_monitor:
      balance_threshold_upokt: 1000000
      check_interval_seconds: 300
      enabled: true
      stake_critical_proof_threshold: 3
      stake_warning_proof_threshold: 10
    batch_size: 1000
    block_health_monitor:
      enabled: true
      slowness_threshold: 1.5
    block_time_seconds: 10
    cache_ttl: 2h
    default_service_factor: 0.01
    keys:
      # Lives under keys: in BOTH binaries. At the top level it is a startup
      # error now -- it used to be read by nothing, which is how the miner ran
      # with key hot reload off while its config said on.
      hot_reload_enabled: true
      keys_file: /keys/supplier-keys.yaml
    known_applications:
    - pokt1pyr6a2yz9rrdhlgg8ff0xqhlsv3qsxcmm3yp8z
    - pokt184zvylazwu4queyzpl0gyz9yf5yxm2kdhh9hpm
    - pokt1lqyu4v88vp8tzc86eaqr4lq8rwhssyn6rfwzex
    - pokt1pn64d94e6u5g8cllsnhgrl6t96ysnjw59j5gst
    leader_election:
      heartbeat_rate_seconds: 10
      leader_ttl_seconds: 30
    logging:
      async: true
      async_buffer_size: 100000
      async_poll_interval: 100
      enable_caller: false
      format: json
      level: info
    metrics:
      addr: 0.0.0.0:9092
      enabled: true
    pocket_node:
      chain_id: pocket
      grpc_insecure: true
      query_node_grpc_url: validator:9090
      query_node_rpc_url: http://validator:26657
      query_timeout_seconds: 5
    pprof:
      addr: 0.0.0.0:6065
      enabled: true
    redis:
      claim_idle_timeout_ms: 60000
      consumer_name: ""
      # N suppliers = N blocked reads, and each one occupies a connection (consumer.go:309).
      # Without this the pool uses the repo default, 50 (transport/redis/client.go:119-122;
      # NOT 40: that was a 10 x GOMAXPROCS calculation of mine that was never verified), and
      # it runs out: measured 2026-09-11 with 1 miner, 50 goroutines waiting for a connection
      # and the WAL draining at 7 relays/s at rest. Formula from
      # config.miner.example.yaml:45 (numSuppliers + 20).
      # 100 and not 72 because the scale profile already moved from 50 to 52 suppliers and
      # the miner's warning came back red in today's run (min_required=72): the margin
      # avoids chasing the number every time the profile changes.
      pool_size: 100
      url: redis://redis-standalone:6379
    session_lifecycle:
      max_concurrent_transitions: 10
    submission_tracking_ttl: 24h
    supplier_claiming:
      claim_ttl_seconds: 30
      rebalance_interval_seconds: 30
      renew_rate_seconds: 10
    supplier_reconcile_interval_seconds: 60
  count: 1
  metrics_base_port: 9092
  pprof_port: 6065
observability:
  enabled: true
  grafana:
    port: 3000
  prometheus:
    port: 9091
    scrape_interval: 2s
path:
  enabled: true
  image: ghcr.io/pokt-network/path
  metrics_port: 9096
  port: 3069
  tag: feat-unified-qos
redis:
  cluster:
    redisFollower: 3
    redisLeader: 3
  enabled: true
  max_memory: 512Mi
  mode: standalone
  # 2026-09-10 (r1): set with NO CAP on purpose, to MEASURE how much memory
  # Redis asks for at 50 suppliers, instead of measuring the cap. **That
  # measurement is already done.**
  #
  # 2026-09-16 (r1, with Jorge): at ~3,700 rps it asks for MORE than 12 GiB and
  # on 2026-09-16 04:33:07Z it was OOMKilled (exit=137) with the cgroup's working
  # set at 12,161 MiB. Measured: 602 B per SMST node, 16,218,683 live nodes at
  # the peak (two sessions: the one that is serving plus the one waiting on a
  # proof, which lives ~30 min longer) = 9.0 GB of data + ~8% allocator overhead
  # = 9.7 GiB of used_memory.
  #
  # A cap is set so Redis REJECTS writes instead of dying:
  #   - 1 GiB-per-step LADDER (Jorge, 2026-09-16):
  #       10 GiB container (kernel: OOMKill, must never happen)
  #        9 GiB maxmemory + noeviction (Redis rejects writes, does not evict)
  #        8 GiB = maxmemory - 1 GiB: the BRAKE closes ("we're full, come back later")
  #     Miner and relayer: 8 GiB container, GOMEMLIMIT 7 GiB.
  #     Measured fact: the day Redis died, the bgsave fork added ~2 GiB on top of
  #     used_memory; with this ladder that only bites if used reaches 9 GiB DURING
  #     a bgsave, and the brake exists so it never gets there.
  #   - noeviction and NOT allkeys-lru: `miner/smst_manager.go:32-34` REQUIRES it --
  #     "must be noeviction. Any *-lru, *-lfu, or *-random policy will silently
  #     evict SMST data under memory pressure and cause this exact failure mode".
  #     The SMST nodes are the proof's preimage: evicting them looks like lost
  #     claims, not like "Redis is full".
  #   - It is safe because the rejection is RETRIED: `IsOOMError` is inside
  #     `IsRetryableError` (`miner/errors.go:104`), so the relay is not lost.
  maxmemory: "9663676416"
  maxmemory_policy: "noeviction"
  memory_limit: 10Gi
  # -1 (the default) turns off the slowlog and `SLOWLOG GET` comes back empty:
  # there is no way to tell "no slow commands happened" from "we never looked".
  slowlog_log_slower_than_us: 10000
relayer:
  base_port: 8180
  config:
    # keys_file | keyring -- mutually exclusive; see tilt/k8s/utils.Tiltfile
    key_source: keys_file
    # test | file -- only read when key_source is keyring. "file" is
    # passphrase-protected and is what production uses.
    keyring_backend: test
    cache_warmup:
      enabled: true
      warmup_concurrency: 10
      warmup_timeout_seconds: 5
    default_max_body_size_bytes: 10485760
    default_request_timeout_seconds: 30
    default_validation_mode: optimistic
    health_check:
      addr: 0.0.0.0:8081
      enabled: true
    http_transport:
      dial_timeout_seconds: 5
      disable_compression: true
      expect_continue_timeout_seconds: 1
      idle_conn_timeout_seconds: 90
      max_conns_per_host: 500
      max_idle_conns: 500
      max_idle_conns_per_host: 100
      response_header_timeout_seconds: 30
      tcp_keep_alive_seconds: 30
      tls_handshake_timeout_seconds: 10
    keys:
      keys_file: /keys/supplier-keys.yaml
    listen_addr: 0.0.0.0:8080
    logging:
      async: true
      async_buffer_size: 100000
      async_poll_interval: 100
      enable_caller: false
      format: json
      level: info
    metrics:
      addr: 0.0.0.0:9090
      enabled: true
    pocket_node:
      grpc_insecure: true
      query_node_grpc_url: validator:9090
      query_node_rpc_url: http://validator:26657
    pool_profiles:
      high:
        idle_conn_timeout_seconds: 90
        max_conns_per_host: 250
        max_idle_conns_per_host: 50
      low:
        idle_conn_timeout_seconds: 90
        max_conns_per_host: 10
        max_idle_conns_per_host: 5
      medium:
        idle_conn_timeout_seconds: 90
        max_conns_per_host: 100
        max_idle_conns_per_host: 20
    pprof:
      addr: 0.0.0.0:6060
      enabled: true
    redis:
      url: redis://redis-standalone:6379
    relay_meter:
      cache_ttl: 2h
      enabled: true
      fail_behavior: open
    response_compression:
      enabled: false
      min_size_bytes: 1024
    services:
      develop-cometbft:
        backends:
          cometbft:
            url: http://validator:26657
        default_backend: cometbft
        max_body_size_bytes: 10485760
        timeout_profile: fast
        validation_mode: eager
      develop-cometbft-optimistic:
        backends:
          cometbft:
            url: http://validator:26657
        default_backend: cometbft
        max_body_size_bytes: 10485760
        timeout_profile: fast
        validation_mode: optimistic
      develop-grpc:
        backends:
          grpc:
            url: backend:50051
        default_backend: grpc
        max_body_size_bytes: 10485760
        timeout_profile: fast
        validation_mode: eager
      develop-grpc-optimistic:
        backends:
          grpc:
            url: backend:50051
        default_backend: grpc
        max_body_size_bytes: 10485760
        timeout_profile: fast
        validation_mode: optimistic
      develop-http:
        backends:
          jsonrpc:
            load_balancing: round_robin
            urls:
            - http://backend:8545
            - name: backup
              url: http://backend-2:8545
        default_backend: jsonrpc
        max_body_size_bytes: 10485760
        pool_profile: low
        timeout_profile: fast
        validation_mode: optimistic
      develop-http-eager:
        backends:
          jsonrpc:
            load_balancing: round_robin
            urls:
            - http://backend:8545
            - name: backup
              url: http://backend-2:8545
        default_backend: jsonrpc
        max_body_size_bytes: 10485760
        pool_profile: low
        timeout_profile: fast
        validation_mode: eager
      develop-stream:
        backends:
          rest:
            url: http://backend:8545/stream/sse
        default_backend: rest
        max_body_size_bytes: 10485760
        timeout_profile: streaming
        validation_mode: eager
      develop-stream-optimistic:
        backends:
          rest:
            url: http://backend:8545/stream/sse
        default_backend: rest
        max_body_size_bytes: 10485760
        timeout_profile: streaming
        validation_mode: optimistic
      develop-websocket:
        backends:
          websocket:
            url: ws://backend:8545/ws
        default_backend: websocket
        max_body_size_bytes: 10485760
        timeout_profile: fast
        validation_mode: eager
      develop-websocket-optimistic:
        backends:
          websocket:
            url: ws://backend:8545/ws
        default_backend: websocket
        max_body_size_bytes: 10485760
        timeout_profile: fast
        validation_mode: optimistic
    simulation:
      enabled: true
      freshness_window_seconds: 60
      identities:
      - allowed_services:
        - develop-http
        app_pubkey_hex: 02f8a265f0e802f1cd6ca87c4c90614178d2f426b2d2417cfe172d120a480335bb
        enabled: true
        gateway_pubkeys_hex:
        - 025821a2ac597a034250ac14b772efccf9297aa7c4bea5444564059a7cfb152063
        key_id: sim-http
        max_rps: 100
      - allowed_services:
        - develop-websocket
        app_pubkey_hex: 02ff92de294bea65988bf929d7c159be03f69c4d74dc75682c78751102febf2d8e
        enabled: true
        gateway_pubkeys_hex:
        - 025821a2ac597a034250ac14b772efccf9297aa7c4bea5444564059a7cfb152063
        key_id: sim-ws
        max_rps: 100
      - allowed_services:
        - develop-stream
        app_pubkey_hex: 0393251466c074a111fd2f6d19ca7fc956ecca512a6d4ae7a0ad6080fd1560926c
        enabled: true
        gateway_pubkeys_hex:
        - 025821a2ac597a034250ac14b772efccf9297aa7c4bea5444564059a7cfb152063
        key_id: sim-stream
        max_rps: 100
      - allowed_services:
        - develop-grpc
        app_pubkey_hex: 020499e5ebe4945576ee20a9f0524ddcd6ca7c1bcea726a6cbb2d68cbc25d369a6
        enabled: true
        gateway_pubkeys_hex:
        - 025821a2ac597a034250ac14b772efccf9297aa7c4bea5444564059a7cfb152063
        key_id: sim-grpc
        max_rps: 100
      - allowed_services:
        - develop-cometbft
        app_pubkey_hex: 0204e2c883e67ff768b9b4261ecb2ab08130ab09c41ca0f7b176f750d90092aa6a
        enabled: true
        gateway_pubkeys_hex:
        - 025821a2ac597a034250ac14b772efccf9297aa7c4bea5444564059a7cfb152063
        key_id: sim-cometbft
        max_rps: 100
      max_concurrent: 32
    timeout_profiles:
      fast:
        dial_timeout_seconds: 5
        request_timeout_seconds: 30
        response_header_timeout_seconds: 30
