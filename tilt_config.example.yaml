        tls_handshake_timeout_seconds: 15
  count: 1
  health_base_port: 8280
  metrics_base_port: 9190
  pprof_port: 6060
validator:
  chain_id: pocket
  enabled: true
  image: ghcr.io/pokt-network/pocketd
  ports:
    grpc: 9090
    rest: 1317
    rpc: 26657
  tag: 0.1.35

# Perfil de escala (2026-09-10, r1): 5 apps/servicio, 50 suppliers. Volver a default al terminar.
localnet:
  profile: scale
  # Reloj de MAINNET para las corridas de carga del paquete 186. El default trackeado
  # es 30 (beta); esto lo pisa desde un archivo gitignored, que es el punto del knob:
  # el arbol queda limpio y run-base111.sh:12 no aborta, asi que la corrida es
  # atribuible. Medido 2026-09-12 con 30: bloques de 29,05 s (timeout_commit 29 s),
  # o sea que el consenso agrega 0,05 s EN REPOSO.
  block_time_seconds: 60
