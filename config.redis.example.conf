# Redis settings for pocket-relay-miner.
#
# This is the configuration the v0.1.0 capacity report (attached to the
# release) was measured with: Redis
# 8.10.1, standalone, a 16 GiB container with 5 CPUs, serving 1 relayer and
# 1 miner. Use it as the redis.conf (examples/docker-compose does) or include it
# from yours.
#
# Run Redis 8.10: every test and measurement behind this release ran on 8.10.1.

# === MEMORY ===
# Every piece of session state lives here: the claim trees, the stake meter,
# the relay streams. With an evicting policy a full Redis drops that state
# silently and it shows up later as lost claims. noeviction makes a full Redis
# refuse writes instead, and both binaries refuse to start without it.
maxmemory-policy noeviction
# Size maxmemory by the sessions Redis holds (the v0.1.0 capacity report has the
# figures), and leave headroom below the container limit for the snapshot
# fork and the allocator. The report's run used 12.8 GiB (the value below) in a
# 16 GiB container.
maxmemory 13743895347

# === PERSISTENCE ===
# RDB snapshots and no AOF, which is what the report measured. A base
# redis.conf may already declare save rules, and save lines accumulate across
# includes, so the empty save clears them before setting these.
save ""
save 900 1 300 10
appendonly no
rdbcompression yes
rdbchecksum no

# === THREADS ===
# Counts the main thread: 4 is main + 3 I/O threads, for the 5 cores it was
# measured with. Keep 1 core of the container spare for the snapshot fork, and
# lower it on a smaller container.
io-threads 4

# === FREEING MEMORY ===
# Deletes and expiries happen in the background, so dropping a large claim
# tree does not stall other commands.
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes
lazyfree-lazy-user-flush yes

# === NETWORK ===
tcp-backlog 511
timeout 0
tcp-keepalive 300
activerehashing yes

# === DIAGNOSTICS ===
# Record commands slower than 10 ms, and keep enough of them to cover a load
# window: the default 128 entries are overwritten within seconds under load.
slowlog-log-slower-than 10000
slowlog-max-len 10000
# Record stalls of 10 ms or more in LATENCY LATEST / HISTORY.
latency-monitor-threshold 10
