# ==============================================================================
# Pocket RelayMiner - Miner Configuration Example
# ==============================================================================
# The miner is the stateful claim/proof submitter, with leader election. The
# relayer has its own example: config.relayer.example.yaml.
#
# The values below are LOCALNET values, ready for local development with Tilt.
# A comment starting with "Production:" gives the value to use in production.
#
# Every comment sits ABOVE the key it describes. A commented-out template is
# enabled by deleting the leading "# " (hash and one space) from each of its
# lines; a line that is still a comment after that single pass carries a
# second "#" on purpose -- it is optional, and leaving it commented keeps it
# unset.
#
# ------------------------------------------------------------------------------
# Before you deploy (REQUIRED)
# ------------------------------------------------------------------------------
# CPU and memory budget: set GOMAXPROCS and GOMEMLIMIT in the process
# environment, or run it in a container with CPU and memory limits (the process
# reads the container's limits at startup). Without either, the miner sizes its
# worker pools and its memory bounds against the WHOLE HOST, not against what
# it is allowed to use.
#
# Redis: run Redis 8.10 or newer, with maxmemory set and maxmemory-policy
# noeviction. The miner refuses to start against a Redis older than 8.10, with
# no memory limit or with an evicting policy. config.redis.example.conf is a
# starting point.

# ==============================================================================
# Redis Configuration (REQUIRED)
# ==============================================================================
redis:
  # Connection URL. The scheme selects the client:
  #   redis:// or rediss:// (TLS)  a single Redis, e.g. "redis://user:password@redis-host:6379/0"
  #   redis-sentinel://            Sentinel, e.g. "redis-sentinel://sentinel1:26379,sentinel2:26379/mymaster?db=0"
  #   redis-cluster://             Cluster, e.g. "redis-cluster://node1:6379,node2:6379,node3:6379"
  # A comma-separated host list under redis:// is NOT a cluster.
  url: "redis://localhost:6379"

  # Readable PREFIX only -- "-<hostname>-<pid>" is always appended. Redis
  # identifies a consumer by name alone, so two replicas sharing one name
  # share a pending-entries list and neither can reclaim the other's
  # stranded deliveries. Leave empty for the default "miner" prefix.
  consumer_name: ""

  # Milliseconds after which a relay delivered to a consumer and not yet
  # acknowledged is reclaimed (recovery from a crashed consumer). Default: 60000.
  # The stream read itself blocks for one block interval per read, so a
  # shutdown is never more than that away; it is not configurable.
  claim_idle_timeout_ms: 60000

  # How often each supplier marks, counts and acknowledges the relays it already
  # added to the session tree, in one Redis script per session. Until then their
  # stream entries stay pending, so it must be at most claim_idle_timeout_ms / 4
  # (startup fails otherwise). Default: 15000.
  relay_batch_flush_interval_ms: 15000

  # Connection pool. The pool must hold blocked and non-blocked connections:
  #
  # BLOCKED (held indefinitely):
  #   - 1 per supplier: the blocking stream read
  #   - 1: block event pub/sub
  #   - 2-3: cache invalidation pub/sub
  #   - 1: supplier registry pub/sub
  #
  # NON-BLOCKED (share the pool, released quickly):
  #   - SMST operations, acknowledgements, session store, cache, leader heartbeat
  #
  # Formula: pool_size = number of suppliers + 20
  #   - 1 supplier:    1 + 20 = 21 connections
  #   - 10 suppliers:  10 + 20 = 30 connections
  #   - 100 suppliers: 100 + 20 = 120 connections
  #
  # Default: 50 (enough for about 30 suppliers).
  # pool_size: 50
  #
  # Warm idle connections. Default: pool_size / 4.
  # min_idle_conns: 12
  #
  # Seconds a caller waits for a pooled connection. Default: 6.
  # pool_timeout_seconds: 6
  #
  # Close a connection idle for this many seconds. Default (unset or 0): 30
  # minutes, the Redis client library's own default.
  # conn_max_idle_time_seconds: 300

  # Key namespace (optional). Only the base prefix is configurable. Every
  # segment below it is fixed, so miner and relayer cannot drift apart on the
  # key layout, and no family's SCAN pattern can match another family's keys.
  # Two base prefixes are two disjoint keyspaces: one Redis, several fleets.
  # It must not contain ':', whitespace, or the characters * ? [ ].
  # MUST be the same in the miner and every relayer of one fleet.
  #
  # The per-family prefixes (cache_prefix, events_prefix, streams_prefix,
  # miner_prefix, supplier_prefix, meter_prefix, params_prefix,
  # consumer_group_prefix) are RETIRED. Setting one to anything other than its
  # historical value fails at startup instead of silently relocating that
  # data -- see docs/REDIS.md.
  # namespace:
  #   # Root prefix for all keys. Default: "ha".
  #   base_prefix: "ha"

# ==============================================================================
# Pocket Blockchain Connection (REQUIRED)
# ==============================================================================
pocket_node:
  # CometBFT RPC endpoint, for queries, blocks and transaction submission.
  # Production: your full node, e.g. "https://your-full-node:26657".
  query_node_rpc_url: "http://localhost:26657"

  # gRPC endpoint, for queries. Production: your full node, e.g.
  # "your-full-node:9090".
  query_node_grpc_url: "localhost:9090"

  # Chain ID used to sign transactions. It MUST match the chain you connect
  # to, or every transaction signature fails. "pocket" is mainnet (and the
  # localnet), "pocket-lego-testnet" is the beta testnet. Default: "pocket".
  chain_id: "pocket"

  # Disable TLS for gRPC. Localnet: true. Production: false.
  grpc_insecure: true

  # Seconds allowed for one chain query. Default: 5.
  query_timeout_seconds: 5

# ==============================================================================
# Transaction Configuration (claim/proof submission)
# ==============================================================================
# The transaction's on-chain deadline is NOT configurable. It is the claim or
# proof window in blocks times block_time_seconds, capped just below the
# 10-minute ceiling the chain enforces on unordered transactions. The window
# length comes from the chain's own parameters, so it follows governance. It
# is the WHOLE window, not the blocks left in it, so every attempt for one
# claim carries the same deadline; what stops a transaction that really is too
# late is timeout_height, which the chain enforces at the window close.
#
# Four keys used to configure it and were retired: tx_timeout_min_seconds,
# tx_timeout_max_seconds, tx_timeout_default_seconds and
# tx_timeout_clock_skew_buffer_seconds. Leaving any of them in a config file
# is reported at startup, and fails "miner validate" and --strict-config.
#
# What to watch instead: ha_tx_timeout_regime_total. "window" and "ceiling" are
# both healthy and say which of the two bounds is binding on your network;
# "unknown" means a deadline could not be derived, and should stay at zero once
# a deploy has settled.
#
# Transactions are broadcast unordered, in SYNC mode: the broadcast returns
# after mempool acceptance, NOT after block inclusion. Inclusion is what the
# inclusion reconciler (below) verifies.

# Every key in this block is optional; the values shown are the defaults.
# transaction:
#   # Gas limit. 0 estimates gas by simulation (recommended); a positive value
#   # is a fixed limit.
#   gas_limit: 0
#
#   # Gas price (1 POKT = 1,000,000 upokt).
#   gas_price: "0.000001upokt"
#
#   # Multiplier applied to the simulated gas, only when gas_limit is 0. 1.7
#   # adds a 70% margin. Raise it if transactions fail with code 11 (out of
#   # gas) despite simulation.
#   gas_adjustment: 1.7
#
#   # How many claim/proof broadcasts may be in flight at once. It bounds the
#   # load on the FULL NODE: with gas estimation on, each transaction costs a
#   # simulation plus a broadcast. Raise it only when
#   # ha_tx_permit_wait_seconds shows broadcasts waiting.
#   tx_max_concurrent: 32
#
#   # Seconds allowed for ONE broadcast attempt. It is not the transaction's
#   # on-chain deadline. Tune it from the p99 of
#   # ha_tx_broadcast_latency_seconds on your own node.
#   tx_rpc_timeout_seconds: 30
#
#   # Seconds between probes of the dedicated transaction connection while it
#   # is idle. The connection only carries traffic inside claim and proof
#   # windows, and a connection dropped in between by a network device looks
#   # healthy to both ends; the probe turns that into a log line before the
#   # window. Lower it if probe failures report a small idle_seconds.
#   tx_conn_probe_interval_seconds: 60
#
#   # Inclusion reconciler. A transaction accepted by BroadcastTx has only
#   # entered the mempool; if it misses its block and is never re-sent, the
#   # claim or proof is forfeited at settlement. Once per block the reconciler
#   # checks inclusion through the proof module's state (it works on nodes
#   # with tx_index=null) and re-sends a still-missing claim or proof while its
#   # window is open. Outcomes are recorded in the submission tracking records
#   # and in ha_miner_claim_inclusion_outcome_total,
#   # ha_miner_proof_inclusion_outcome_total, ha_miner_claim_rebroadcasts_total
#   # and ha_miner_proof_rebroadcasts_total. The reconciler cannot be turned
#   # off; these keys only tune it.
#   #
#   # Worker pool for the per-block reconcile (one task per owned supplier per
#   # block). Capped at tx_max_concurrent.
#   inclusion_reconciler_max_concurrent: 64
#   #
#   # Milliseconds allowed to reconcile one supplier per block (the chain query
#   # plus any re-sends).
#   inclusion_reconciler_per_group_timeout_ms: 10000
#   #
#   # Cap on in-window re-sends. Unset: no cap, a still-missing claim or proof
#   # is re-sent on every block its window allows (each re-send costs one
#   # transaction fee). 0: observe only -- verify and record, never re-send.
#   ## max_rebroadcasts: 2
#   #
#   # Stop re-sending within this many blocks of the window close. Default: 0
#   # (the block before the close is the last one a re-send can still land in).
#   ## rebroadcast_safety_blocks: 0
#   #
#   # Diagnostic only. true skips the check that a session's claim is on chain
#   # before its proof is submitted, which brings back proof submissions for
#   # claims that never landed and the retry storms they cause. Default: false.
#   ## disable_pre_proof_claim_verification: false

# ==============================================================================
# Supplier Keys Configuration (REQUIRED)
# ==============================================================================
# Full reference: docs/SUPPLIER_KEYS.md
#
# keys_file and keyring are MUTUALLY EXCLUSIVE -- setting both is a startup
# error. Configure exactly one, so nothing has to decide at runtime which
# source wins a duplicate or what it means when one of them is unreadable.
keys:
  # Reload signing keys while the miner runs, so adding or pulling a key takes
  # effect without a restart. Default: true.
  #
  # Every key source is covered. keys_file is also watched (its directory is
  # watched, which is what makes a Kubernetes secret's ..data swap register), so
  # a change there lands almost at once. A keyring cannot be watched, so its
  # changes are found by the reload timer instead -- within 30s. Setting it to
  # false is logged as a warning at startup, because a key change then needs a
  # restart.
  hot_reload_enabled: true

  # Option 1: a YAML file of hex-encoded private keys (simple; suits testing).
  keys_file: "/keys/supplier-keys.yaml"

  # Option 2: a Cosmos SDK keyring (recommended for production). Remove
  # keys_file above when you enable this.
  # keyring:
  #   # "file" (passphrase-protected) or "test" (fixed password). "os" and
  #   # "memory" are refused at startup: "memory" starts empty and nothing
  #   # writes to it, and "os" depends on whether a system keychain is
  #   # reachable.
  #   backend: "file"
  #   # Directory CONTAINING the keyring; the file backend reads <dir>/keyring-file.
  #   dir: "/keys/keyring"
  #   app_name: "pocket"
  #   # For backend "file", say WHERE the passphrase is -- never the passphrase
  #   # itself, so the config stays non-sensitive. A mounted secret:
  #   passphrase_file: "/secrets/keyring-passphrase"
  #   # Or the NAME of an environment variable (mutually exclusive with
  #   # passphrase_file):
  #   ## passphrase_env: "KEYRING_PASSPHRASE"
  #   # With neither, it is read from stdin:
  #   #   echo "$SECRET" | pocket-relay-miner miner --config config.yaml
  #   # which suits a terminal or a pipe, but not a container (stdin is /dev/null).
  #   # Optional: load only these keys (empty = load all).
  #   key_names:
  #     - "supplier1"
  #     - "supplier2"

# ==============================================================================
# Block Time (REQUIRED)
# ==============================================================================
# Expected block time in seconds. REQUIRED: there is no default, and the miner
# does not start without it. Every claim and proof transaction deadline is
# computed from it, so a wrong value is a wrong deadline on every transaction.
#
# It is a per-deployment value, not a constant: mainnet, testnet and localnet
# run different block times, and mainnet's drifts with network conditions.
# Measure the block time of your target network; beta (pocket-lego-testnet)
# is roughly 30s, mainnet (pocket) roughly 60s.
# Localnet runs faster blocks.
block_time_seconds: 10

# Block health monitoring: warns when blocks arrive slower than expected (a
# lagging full node or a network problem).
block_health_monitor:
  # Default: true.
  enabled: true
  # Warn when a block takes longer than this multiple of block_time_seconds
  # (1.5 with 10s blocks: slower than 15s). Default: 1.5.
  slowness_threshold: 1.5

# ==============================================================================
# Balance and Stake Monitoring
# ==============================================================================
balance_monitor:
  # Runs the balance and stake monitor. false turns it off entirely: no balance
  # warnings and no stake alerts. Default: true.
  enabled: true

  # Seconds between checks. Default: 300.
  check_interval_seconds: 300

  # Warn when a supplier's balance drops below this, in upokt
  # (1 POKT = 1,000,000 upokt). Size it from your own transaction cost:
  # (claims + proofs per day) x average fee paid x the days of buffer you
  # want. Default: 1000000 (1 POKT).
  balance_threshold_upokt: 1000000

  # Stake health: alerts on how many missed proofs a supplier can absorb before
  # it is auto-unstaked.
  #   missedProofsRemaining = (currentStake - minStake) / proofMissingPenalty
  #
  # Example:
  #   - current stake: 60,000,000,000 upokt (60,000 POKT)
  #   - minimum stake: 59,500,000,000 upokt (59,500 POKT)
  #   - proof missing penalty: 1 upokt per missed proof
  #   - buffer: 500,000,000 upokt = 500 million missed proofs (very safe)
  #
  # WARNING when fewer than this many missed proofs remain. Default: 10.
  stake_warning_proof_threshold: 10
  # CRITICAL when fewer than this many missed proofs remain. Default: 3.
  stake_critical_proof_threshold: 3

# ==============================================================================
# Session Lifecycle
# ==============================================================================
# The session lifecycle is driven by block events, not by polling. Submission
# timing within a window follows the protocol's own deterministic spreading of
# suppliers; no manual buffer is needed.
session_lifecycle:
  # Sessions that may build and submit claims/proofs at the same time.
  # Default: 10.
  max_concurrent_transitions: 10

# ==============================================================================
# Worker Pools
# ==============================================================================
# Parallelism for claim/proof submission and other background work.
# Auto-sizing: max(GOMAXPROCS x cpu_multiplier, suppliers x workers_per_supplier)
# + query_workers.
#
# Example (4 CPUs, 78 suppliers, defaults):
#   max(4 x 4, 78 x 6) + 20 = max(16, 468) + 20 = 488 workers
#
# With many suppliers the pool follows the supplier count, so every supplier
# can submit its claims and proofs in parallel inside a window. The values
# shown are the defaults.
# worker_pools:
#   # 0 = auto-size (recommended).
#   master_pool_size: 0
#   # Per-CPU baseline.
#   cpu_multiplier: 4
#   # Workers per supplier (claim and proof building in parallel).
#   workers_per_supplier: 6
#   # Fixed workers for chain queries.
#   query_workers: 20

# ==============================================================================
# Leader Election (HA deployments)
# ==============================================================================
leader_election:
  # Seconds the leader lock lasts; the leader must renew it before then.
  # Default: 30.
  leader_ttl_seconds: 30
  # Seconds between acquire/renew attempts. Default: 10.
  heartbeat_rate_seconds: 10

# ==============================================================================
# Supplier Claiming (HA multi-miner)
# ==============================================================================
# Suppliers are distributed across miner replicas with Redis leases.
# - Single miner: it claims every configured supplier.
# - Several miners: a fair share each, rebalanced automatically.
#
# How it works:
#   1. Each miner claims suppliers with a Redis lease (SET NX with a TTL).
#   2. Miners register in an "active" set with a heartbeat.
#   3. Fair share = ceil(totalSuppliers / activeMiners).
#   4. Rebalancing releases excess claims when a miner joins.
#   5. When a miner crashes, its claims expire after claim_ttl_seconds.
#
# Example with 3 miners and 9 suppliers:
#   - fair share = ceil(9/3) = 3 suppliers per miner
#   - if miner-1 crashes, miner-2 and miner-3 claim its 3 suppliers
#
# IMPORTANT: with 500+ suppliers the renewal loop runs sequentially and can take
# several seconds per cycle. If claim_ttl_seconds is too low, claims expire
# before renewal completes, causing duplicate lifecycles and lost rewards.
# Raise claim_ttl_seconds for high supplier counts: 120 for 500-1000
# suppliers, 180 above 1000.
#
# Maximum failover time: claim_ttl_seconds + rebalance_interval_seconds.
supplier_claiming:
  # Lease duration in seconds. Default: 90.
  claim_ttl_seconds: 90
  # Seconds between lease renewals. Default: 10.
  renew_rate_seconds: 10
  # Seconds between redistribution checks. Default: 30.
  rebalance_interval_seconds: 30

# ==============================================================================
# Processing
# ==============================================================================
# Session trees (SMST) always live in Redis. The Redis streams are the
# write-ahead log of relays.

# Relays read per stream read. Default: 1000.
batch_size: 1000

# TTL of the miner's cached Redis data (sessions, SMST trees). A safety net: the
# miner cleans up after itself, and the TTL only bounds a leak when cleanup
# fails. Default: 2h, which covers several session lifecycles at a 60s block
# time.
cache_ttl: "2h"

# TTL of session state in Redis. Default: cache_ttl. Setting it to anything
# other than cache_ttl lets sessions and their trees expire at different
# times.
# session_ttl: "2h"

# TTL of the claim/proof submission tracking records (transaction hashes,
# success or failure, errors, timing), for post-mortem analysis. Inspect them
# with `pocket-relay-miner redis submissions`. Default: 24h.
# Production: "168h" (7 days) for a longer audit trail.
submission_tracking_ttl: "24h"

# Seconds between polls of every keyring supplier's on-chain stake and service
# list, so a stake, unstake or service change is picked up without a restart.
# Lower = faster pickup, more chain queries. Default: 60. A negative value
# disables the poll (tests only).
supplier_reconcile_interval_seconds: 60

# Applications to discover at startup (optional; speeds up startup). These are
# the localnet genesis applications.
known_applications:
  - "pokt1mrqt5f7qh8uxs27cjm9t7v9e74a9vvdnq5jva4"
  - "pokt184zvylazwu4queyzpl0gyz9yf5yxm2kdhh9hpm"
  - "pokt1lqyu4v88vp8tzc86eaqr4lq8rwhssyn6rfwzex"
  - "pokt1pn64d94e6u5g8cllsnhgrl6t96ysnjw59j5gst"

# ==============================================================================
# Service Factor (economic policy)
# ==============================================================================
# The service factor sets the per-session stake cap the relay meter applies to
# each (application, supplier) pair. What happens to a relay beyond the cap
# depends on the service's validation mode: in optimistic mode it is served
# but not mined (dropped with reason "stake_exhausted"); in eager mode it is
# refused with HTTP 429.
#
# Configured on the MINER only. The leader publishes it to Redis when it is
# elected and every service_factor_republish_interval, and relayers reload it
# on change without a restart. A relayer refuses relays until the first
# published value exists, so start the miner first.
#
# ------------------------------------------------------------------------------
# Formula
# ------------------------------------------------------------------------------
#
#   if a service factor is SET:
#       effectiveLimit = appStake x service_factor
#   else (baseLimit):
#       appStakePerSupplier = appStake / num_suppliers_per_session
#       pendingSessions     = ceil(sessionEndToProofWindowCloseBlocks /
#                                  num_blocks_per_session) + 1
#       baseLimit           = appStakePerSupplier / pendingSessions
#
#   sessionEndToProofWindowCloseBlocks =
#       claim_window_open_offset_blocks + claim_window_close_offset_blocks +
#       proof_window_open_offset_blocks + proof_window_close_offset_blocks
#
# baseLimit is what the protocol guarantees a supplier. Expressed as a factor
# it is 1 / num_suppliers_per_session / pendingSessions, for any application.
# The relayer logs a warning ("serviceFactor results in limit exceeding
# protocol guarantee") whenever effectiveLimit is above baseLimit: that work
# may not be paid. Claims above the chain's settlement cap are accepted but
# trimmed to it; over-servicing is not penalized, it is just not paid.
#
# ------------------------------------------------------------------------------
# Worked example
# ------------------------------------------------------------------------------
# Query your network's shared and session parameters and recompute; these are
# mainnet's at the time of writing:
#     num_blocks_per_session              = 20
#     claim_window_open_offset_blocks     = 11
#     claim_window_close_offset_blocks    = 10
#     proof_window_open_offset_blocks     = 1
#     proof_window_close_offset_blocks    = 10
#     num_suppliers_per_session           = 50
#
# Derived:
#     sessionEndToProofWindowCloseBlocks = 11 + 10 + 1 + 10 = 32
#     pendingSessions                    = ceil(32 / 20) + 1 = 3
#     baseLimit as a factor              = 1 / 50 / 3 = 0.0067
#
# Example application with 5,874.70 POKT staked:
#     appStakePerSupplier = 5,874.70 / 50 = 117.49 POKT
#     baseLimit           = 117.49 / 3    =  39.16 POKT per session per supplier
#
# Under those parameters a factor of 0.0067 or less stays within what the
# protocol guarantees, and anything above it triggers the relayer's warning.
# Do not go above the baseLimit factor without data: for each service, measure
# how many distinct suppliers actually claim per session over the last few
# settled sessions. If that mean N is below num_suppliers_per_session, the
# guaranteed factor is roughly 1 / N / pendingSessions.
#
# Leaving the factor unset (or 0) uses baseLimit, which follows the chain's
# parameters by itself when governance changes them.

# Global service factor, for every service without an override below.
# Default: unset (baseLimit). 0.01 is a localnet value: the localnet genesis
# has 15 suppliers per session and 20-block sessions, so its baseLimit factor
# is 1 / 15 / 3 = 0.022. On mainnet (worked example above) 0.01 is above
# baseLimit.
default_service_factor: 0.01

# Per-service overrides: service ID -> factor (a plain map, not a service
# config). Use one when a service's apps see a very different number of
# suppliers claiming per session.
# service_factors:
#   eth: 0.006
#   poly: 0.005

# How often the leader rewrites the service factor in Redis. The published
# value carries no expiry -- relayers must be able to tell "no factor
# configured" from "nothing published yet", and an expiring key cannot say
# which. This rewrite is what bounds how long a miner that lost leadership can
# leave its own config standing. Default: 5m.
# service_factor_republish_interval: "5m"

# ==============================================================================
# Observability Configuration
# ==============================================================================
# Prometheus metrics server.
metrics:
  enabled: true
  addr: ":9092"

# pprof profiling server. Default: disabled (127.0.0.1:6060, loopback only,
# when enabled with no addr). 6060 is also the relayer's default, so a miner
# and a relayer on 1 host need different ports: this example uses 6065. To
# reach it from outside the host or container, set addr explicitly, e.g.
# "0.0.0.0:6065", and firewall the port.
pprof:
  enabled: true
  addr: "127.0.0.1:6065"

logging:
  # debug, info, warn or error; any other value fails config load.
  # Localnet uses debug. Production: info.
  level: "debug"
  # json or text. json is what a log pipeline can parse levels from. Logs go
  # to stderr.
  format: "json"
  # Non-blocking logging through a ring buffer; recommended. Default: true.
  async: true
  # Ring buffer size, in log MESSAGES (not bytes). When it is full, the oldest
  # messages are dropped and the drop is reported.
  async_buffer_size: 100000
  # Milliseconds between flushes of the ring buffer. 10-50 for high-throughput
  # production.
  async_poll_interval: 100
  # Add caller file:line to each line (about 14% more allocations). Production:
  # false.
  enable_caller: false
  # GLOBAL log sampling for extreme throughput: it samples every component and
  # level alike, state-change logs included. Leave off unless log volume is a
  # measured problem.
  # sampling: false
  # Lines always written before sampling starts.
  # sampling_initial: 100
  # Then one line in N.
  # sampling_thereafter: 10
