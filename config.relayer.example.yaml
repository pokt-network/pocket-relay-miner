# Pocket RelayMiner Relayer Configuration Example
# This file uses LOCALNET defaults - ready for local development with Tilt.
# For PRODUCTION, see comments marked [PRODUCTION] for recommended values.
#
# The relayer is a stateless HTTP/WebSocket/gRPC/Streaming proxy

# HTTP server listen address
listen_addr: "0.0.0.0:8080"

# Redis connection (required for publishing relays to miners)
redis:
  # Single Redis instance
  url: "redis://localhost:6379"

  # OR Redis Cluster (comment out url above, uncomment below)
  # url: "redis://redis-node1:6379,redis-node2:6379,redis-node3:6379"

  # Connection pool settings (2x go-redis defaults for production)
  # Omit these to use defaults (auto-calculated based on CPU cores)
  # pool_size: 320                   # Max connections (default: 20 × runtime.GOMAXPROCS)
  # min_idle_conns: 80               # Warm idle connections (default: pool_size / 4)
  # pool_timeout_seconds: 4          # Wait time for connection from pool
  # conn_max_idle_time_seconds: 300  # Close idle connections after 5 minutes

  # Namespace configuration (optional)
  # Only the base prefix is configurable. Every segment below it is fixed in
  # code, so miner and relayer cannot drift apart on the key layout, and no
  # family's SCAN pattern can be made to match another family's keys.
  # Two base prefixes are two disjoint keyspaces: one Redis, several fleets.
  # namespace:
  #   base_prefix: "ha"                # Root prefix for all keys (default: "ha")
  #
  # The per-family prefixes (cache_prefix, events_prefix, streams_prefix,
  # miner_prefix, supplier_prefix, meter_prefix, params_prefix,
  # consumer_group_prefix) are RETIRED. Setting one to anything other than its
  # historical value now fails at startup instead of silently relocating that
  # data — see docs/REDIS.md.

# Pocket blockchain connection
pocket_node:
  # RPC endpoint for block subscriptions and queries (localnet defaults)
  query_node_rpc_url: "http://localhost:26657"
  # [PRODUCTION] query_node_rpc_url: "https://rpc.testnet.pokt.network"

  # gRPC endpoint for queries (sessions, applications, services)
  query_node_grpc_url: "localhost:9090"
  # [PRODUCTION] query_node_grpc_url: "grpc.testnet.pokt.network:443"

  # gRPC settings
  grpc_insecure: true  # Disable TLS for gRPC (localnet)
  # [PRODUCTION] grpc_insecure: false

  # NOTE: Relayers always use Redis pub/sub for block events (synchronized with miner).
  # RPC/gRPC endpoints are used for health checks and fallback queries only.

# Supplier signing keys (required for signing relay responses)
keys:
  # keys_file and keyring are MUTUALLY EXCLUSIVE -- setting both is a startup
  # error. Configure exactly one, so nothing has to decide at runtime which
  # source wins a duplicate or what it means when one of them is unreadable.

  # Option 1: Load from YAML file (simple, recommended for testing)
  keys_file: "/keys/supplier-keys.yaml"

  # Option 2: Use Cosmos SDK keyring (recommended for production)
  # keyring:
  #   backend: "file"  # file, os, test, memory
  #   dir: "/path/to/keyring"
  #   app_name: "pocket"
  #   key_names:  # Optional: specific keys to load
  #     - "supplier1"
  #     - "supplier2"

  # Reload signing keys while the relayer runs, so adding or pulling a key takes
  # effect on a RUNNING relayer instead of only on the next restart.
  # Default: true.
  #
  # Every key source is covered. keys_file is also watched (its directory is
  # watched, which is what makes a Kubernetes secret's ..data swap register), so
  # a change there lands almost at once. A keyring cannot be watched, so its
  # changes are found by the reload timer instead -- within 30s. The relayer logs
  # which sources are watched and which rely on the timer at startup.
  hot_reload_enabled: true

# Service configurations (map of service_id -> config)
# Genesis defines 4 services: develop-http, develop-websocket, develop-stream, develop-grpc
# Each has 15 suppliers staked for it.
services:
  # HTTP/JSON-RPC service (localnet) - multi-backend example
  develop-http:
    validation_mode: eager
    timeout_profile: fast
    # pool_profile selects a per-service HTTP connection pool from the
    # pool_profiles block below. Options: low / medium / high, or a custom
    # name. Omit to inherit the global http_transport defaults.
    pool_profile: low
    max_body_size_bytes: 10485760  # 10MB
    default_backend: jsonrpc  # Use jsonrpc for proper protocol labeling
    backends:
      # Backends are keyed by TRANSPORT TYPE. The key must be exactly one of:
      #   jsonrpc | rest | websocket | grpc | cometbft
      # A relay is routed to a backend by exact type match, with NO fallback to
      # another type -- a websocket relay needs a `websocket:` backend with a
      # ws:// url, a grpc relay needs a `grpc:` backend, and so on. An unknown
      # key (e.g. `ws:` instead of `websocket:`) is rejected at startup.
      #
      # Each backend is health-checked independently.
      jsonrpc:
        load_balancing: round_robin  # first_healthy (default) or round_robin
        urls:
          - "http://backend:8545"
          - name: backup
            url: "http://backend-2:8545"
        # Optional headers/auth (shared across all backends in this pool):
        # headers:
        #   X-Custom-Header: "value"
        # authentication:
        #   bearer_token: "your-token"
        #
        # Active health checks (recommended for production):
        # health_check:
        #   enabled: true
        #   endpoint: "/health"
        #   interval_seconds: 10
        #   timeout_seconds: 5
        #   unhealthy_threshold: 5
        #   healthy_threshold: 3
        #   # Probe-only headers, merged over the pool headers above (probe wins
        #   # on conflict). Use for a health-check token not sent on real relays:
        #   headers:
        #     X-Health-Token: "probe-only-secret"
        #
        # Recovery timeout: auto-recover circuit-breaker-tripped backends after N seconds.
        # Prevents death spiral when all backends are unhealthy and no health checks are configured.
        # Default: 30 seconds. Set to 0 to disable (requires active health checks for recovery).
        # recovery_timeout_seconds: 30

  # WebSocket service (localnet)
  develop-websocket:
    validation_mode: eager
    timeout_profile: fast
    max_body_size_bytes: 10485760
    default_backend: websocket
    backends:
      websocket:
        url: "ws://backend:8545/ws"
        # [PRODUCTION] url: "ws://eth-node:8545/ws"

  # Streaming/SSE service (localnet)
  develop-stream:
    validation_mode: eager
    timeout_profile: streaming  # 10 min timeout for streaming responses
    max_body_size_bytes: 10485760
    default_backend: rest
    backends:
      rest:
        url: "http://backend:8545/stream/sse"
        # [PRODUCTION] url: "http://eth-node:8545/stream/sse"

  # gRPC service (localnet)
  develop-grpc:
    validation_mode: eager
    timeout_profile: fast
    max_body_size_bytes: 10485760
    default_backend: grpc
    backends:
      grpc:
        url: "backend:50051"
        # [PRODUCTION] url: "eth-node:50051"

  # CometBFT service (localnet) — routes RPCType 5 to the validator's CometBFT RPC.
  # CometBFT RPC is JSON-RPC over HTTP, so the backend is a plain HTTP endpoint.
  develop-cometbft:
    validation_mode: eager
    timeout_profile: fast
    max_body_size_bytes: 10485760
    default_backend: cometbft
    backends:
      cometbft:
        url: "http://validator:26657"
        # [PRODUCTION] url: "http://cometbft-node:26657"

  # Example: text-generation service with streaming profile
  # This demonstrates using the "streaming" timeout profile for long-running LLM requests
  # The profile defines request_timeout_seconds (600s) and response_header_timeout (0 for streaming)
  # text-generation:
  #   validation_mode: eager
  #   timeout_profile: streaming  # 10 min request timeout, no header timeout for streaming
  #   backends:
  #     jsonrpc:
  #       url: "https://llm-backend.example.com"
  #       authentication:
  #         bearer_token: "your-api-key"

  # Example: eth-mainnet service
  # eth-mainnet:
  #   validation_mode: optimistic
  #   default_backend: jsonrpc
  #   backends:
  #     jsonrpc:
  #       url: "https://mainnet.infura.io/v3/YOUR_PROJECT_ID"
  #       authentication:
  #         bearer_token: "YOUR_API_KEY"
  #     websocket:
  #       url: "wss://mainnet.infura.io/ws/v3/YOUR_PROJECT_ID"

  # Example: Solana service
  # solana-mainnet:
  #   validation_mode: eager
  #   request_timeout_seconds: 60  # Solana can be slower
  #   default_backend: jsonrpc
  #   backends:
  #     jsonrpc:
  #       url: "https://api.mainnet-beta.solana.com"

# Default validation mode (used when not specified per-service)
# Options: "eager" | "optimistic"
default_validation_mode: optimistic

# Default request timeout in seconds (used when not specified per-service)
default_request_timeout_seconds: 30

# Default max body size in bytes (used when not specified per-service)
default_max_body_size_bytes: 10485760  # 10MB

# Metrics server (Prometheus)
metrics:
  enabled: true
  addr: "0.0.0.0:9090"

# Pprof profiling (for debugging, disable in production)
pprof:
  enabled: true  # Enabled by default for localnet debugging
  addr: "0.0.0.0:6060"
  # [PRODUCTION] enabled: false
  # [PRODUCTION] addr: "localhost:6060"

# Health check endpoint
health_check:
  enabled: true
  addr: "0.0.0.0:8081"

# Relay meter (rate limiting based on app stakes)
relay_meter:
  # Enable metering and rate limiting
  enabled: true


  # Fail behavior when Redis is unavailable
  # - "open": Allow relays when Redis down (prioritize availability)
  # - "closed": Reject relays when Redis down (prioritize safety)
  fail_behavior: "open"

  # Cache TTL for all Redis data (streams, params, app stakes, meters)
  # Redis TTL handles automatic expiration - no cleanup goroutines needed.
  # Default: 2h -- covers ~6 session lifecycles at a rough 60s/block mainnet estimate (20 blocks/session; real block time drifts with network conditions and differs per network -- this is illustrative margin, not a precise budget)
  cache_ttl: 2h

# HTTP transport settings (connection pooling and timeouts for backend requests)
# These settings optimize connection reuse and prevent resource exhaustion.
# Defaults are tuned for 1000+ RPS - override based on your backend characteristics.
http_transport:
  # Connection pool limits (5x increased for high throughput)
  max_idle_conns: 500  # Total idle connections across all backends (default: 500)
  max_idle_conns_per_host: 100  # Idle connections per backend (default: 100)
  max_conns_per_host: 500  # Total connections per backend to prevent port exhaustion (default: 500, 0 = unlimited)

  # Connection timeout settings
  idle_conn_timeout_seconds: 90  # How long to keep idle connections alive (default: 90)
  dial_timeout_seconds: 5  # Timeout for establishing new connection (default: 5)
  tls_handshake_timeout_seconds: 10  # Timeout for TLS handshake (default: 10)
  response_header_timeout_seconds: 30  # Timeout waiting for response headers (default: 30)
  expect_continue_timeout_seconds: 1  # Timeout for 100-continue response (default: 1)
  tcp_keep_alive_seconds: 30  # TCP keepalive period for active connections (default: 30, 0 = disabled)

  # Content handling
  disable_compression: true  # Don't modify content encoding (required for relay protocol)

# ==============================================================================
# Response Compression (gzip of signed relay responses)
# ==============================================================================
# Off by default. The relayer does NOT gzip the signed relay responses it
# returns to the gateway unless this is explicitly enabled. gzip was shown
# to consume ~9% of relayer CPU at 200 RPS on the Apr 14 2026 pprof profile
# from breeze, so the default prioritises CPU over bandwidth. The gateway
# still negotiates compression with downstream clients independently.
#
# When enabled, compression only actually runs when both:
#   - the client sent `Accept-Encoding: gzip`
#   - the response is at least `min_size_bytes` bytes long
# Below `min_size_bytes`, gzip overhead (header + dictionary + trailer)
# makes the output larger than the input for small JSON-RPC responses.
response_compression:
  enabled: false
  min_size_bytes: 1024

# ==============================================================================
# HTTP Timeout Profiles (Advanced)
# ==============================================================================
# Define timeout profiles for different service types.
# Each profile defines request_timeout_seconds and HTTP client timeouts.
# Services select a profile via the timeout_profile field.
# Auto-populated with "fast" and "streaming" defaults if not specified.
timeout_profiles:
  # Fast profile for standard RPC services (default for all services)
  fast:
    request_timeout_seconds: 30  # Overall request timeout (30s default)
    response_header_timeout_seconds: 30  # Timeout waiting for response headers
    dial_timeout_seconds: 5  # Timeout for establishing connection
    tls_handshake_timeout_seconds: 10  # Timeout for TLS handshake

  # Streaming profile for long-running services (LLMs, AI models)
  streaming:
    request_timeout_seconds: 600  # 10 minute timeout for LLM completions
    response_header_timeout_seconds: 0  # No header timeout for streaming responses
    dial_timeout_seconds: 10  # Allow more time for connection
    tls_handshake_timeout_seconds: 15  # Allow more time for TLS

# ==============================================================================
# HTTP Pool Profiles (Advanced — per-service connection pool sizing)
# ==============================================================================
# Each service gets its own *http.Client / *http.Transport so connection pool
# budgets are isolated. One slow backend cannot starve slots from healthy
# services.
#
# Services select a profile via the `pool_profile` field. If unset, the
# service inherits the global http_transport defaults. Auto-populated with
# "low" / "medium" / "high" defaults if not specified.
#
# The tier values below come from a sweep-optimal loadtest (2026-04-14)
# targeting p99 <= 100ms for each backend. Re-run `scripts/loadtest/backends.sh
# sweep-optimal` on your own infra to retune — operator-specific.
pool_profiles:
  # Fast backends (sub-5ms p99): avax, sui, eth, poly, boba, bera, zksync-era,
  # xrplevm-testnet, eth-sepolia. Tiny pool because requests complete so fast
  # that few slots are ever in use; more slots just waste memory + FDs.
  low:
    max_conns_per_host: 10
    max_idle_conns_per_host: 5
    idle_conn_timeout_seconds: 90

  # Moderately latent backends (tens of ms p99): xrplevm, opbnb.
  medium:
    max_conns_per_host: 100
    max_idle_conns_per_host: 20
    idle_conn_timeout_seconds: 90

  # Slow backends that need many in-flight to sustain RPS (hundreds of ms p99
  # with occasional slower calls): op, fuse.
  high:
    max_conns_per_host: 250
    max_idle_conns_per_host: 50
    idle_conn_timeout_seconds: 90

# Cache warmup (optional - preload application data at startup)
cache_warmup:
  # Enable cache warmup (speeds up first requests)
  enabled: true

  # Known applications to pre-load (if you know your app addresses)
  # known_applications:
  #   - "pokt1mrqt5f7qh8uxs27cjm9t7v9e74a9vvdnq5jva4"
  #   - "pokt1abc..."

  # Concurrency for warmup operations (higher = faster but more load)
  warmup_concurrency: 10

  # Timeout per application warmup
  warmup_timeout_seconds: 5

# Logging configuration
logging:
  level: "debug"  # debug, info, warn, error (localnet uses debug; anything else fails config load)
  format: "json"  # json, text (json required for Loki log level detection; always stderr)
  async: true  # Enable async logging for better performance
  async_buffer_size: 100000  # Async log buffer size (bytes)
  async_poll_interval: 100  # Async writer flush interval (ms); 10-50 for high-throughput production
  enable_caller: false  # Add caller file:line to logs (~14% alloc overhead, disable in production)
  # sampling: false  # GLOBAL log sampling for extreme throughput; drops state-change logs too.
  # sampling_initial: 100  # lines always written before sampling kicks in
  # sampling_thereafter: 10  # then 1 in N lines
  # [PRODUCTION] level: "info", enable_caller: false

# Simulated relays (optional - disabled by default)
# Serves synthetic relays for pinned (application, gateway-ring) identities,
# verified against config-pinned public keys instead of an on-chain session.
# SECURITY: app_pubkey_hex and every entry in gateway_pubkeys_hex are
# rejected at startup if they match the deterministic ring placeholder key
# (its private half is publicly derivable from a well-known seed) — pinning
# it would let anyone forge simulated relays for that identity.
simulation:
  # Enable the simulated-relay feature. Default: false.
  enabled: false

  # Max simulated relays in flight across all identities. Default: 32.
  max_concurrent: 32

  # How old a simulated relay request's timestamp may be before it's
  # rejected as stale, in seconds. Default: 30.
  freshness_window_seconds: 30

  # Pinned simulated-relay identities. Each identity is served ONLY when
  # BOTH `simulation.enabled: true` above AND its own `enabled: true` are
  # set explicitly (fail-closed) - defaults do not turn identities on.
  #
  # No identities are pinned: the whole `identities` key is commented out
  # below, so the shipped example needs no edit to stay inert. The keys in
  # the template are illustrative and are NOT valid secp256k1 public keys -
  # a config carrying them is rejected at startup once `simulation.enabled`
  # is true. Generate your own dedicated simulation app and gateway key
  # pairs and pin their public halves here; see docs/simulated-relays.md
  # for the provisioning steps.
  #
  # TO PIN AN IDENTITY: delete the leading "# " (hash and one space) from
  # every line of the template below, then replace the placeholder keys.
  # Lines that are still comments after that single pass carry a second
  # "#" on purpose: they are OPTIONAL fields, and leaving them commented is
  # what keeps them unset. Uncomment only the ones you actually want.
  # identities:
  #   - key_id: "my-sim-identity"      # sent as the Pocket-Simulation-Key-Id header
  #     enabled: true                  # per-identity switch (required to activate)
  #
  #     # Compressed secp256k1 pubkey (hex, 33 bytes) of the simulated
  #     # application. Must be a real public key you generated.
  #     app_pubkey_hex: "02<64 hex chars>"
  #
  #     # Compressed secp256k1 pubkeys (hex) of the simulated gateway ring
  #     # members. At least one required. Keep their private halves in your
  #     # health-check tooling - never in this file.
  #     gateway_pubkeys_hex:
  #       - "03<64 hex chars>"
  #
  #     ## OPTIONAL - per-identity simulated relay rate. Default: 5.
  #     # max_rps: 5
  #
  #     ## OPTIONAL - RFC3339 expiry, for key rotation. Unset means the
  #     ## identity never expires. Setting this is a scheduled outage of
  #     ## your simulated traffic on that date - pick it deliberately.
  #     # not_after: "2027-01-01T00:00:00Z"
  #
  #     ## OPTIONAL - restrict this identity to specific services. Unset
  #     ## means every configured service is allowed.
  #     # allowed_services:
  #     #   - develop-http
