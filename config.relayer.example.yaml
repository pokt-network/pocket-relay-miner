# ==============================================================================
# Pocket RelayMiner - Relayer Configuration Example
# ==============================================================================
# The relayer is the stateless proxy (JSON-RPC, WebSocket, gRPC, REST/SSE,
# CometBFT). The miner has its own example: config.miner.example.yaml.
#
# The values below are LOCALNET values, ready for local development with Tilt.
# A comment starting with "Production:" gives the value to use in production.
#
# Every comment sits ABOVE the key it describes. A commented-out template is
# enabled by deleting the leading "# " (hash and one space) from each of its
# lines; a line that is still a comment after that single pass carries a
# second "#" on purpose -- it is optional, and leaving it commented keeps it
# unset.
#
# ------------------------------------------------------------------------------
# Before you deploy (REQUIRED)
# ------------------------------------------------------------------------------
# CPU and memory budget: set GOMAXPROCS and GOMEMLIMIT in the process
# environment, or run it in a container with CPU and memory limits (the process
# reads the container's limits at startup). Without either, the relayer sizes
# its worker pools, its Redis connection pool and its validation-queue memory
# against the WHOLE HOST, not against what it is allowed to use.
#
# Redis: run Redis 8.10, with maxmemory set and maxmemory-policy noeviction.
# The relayer refuses to start against a Redis with no memory limit or with an
# evicting policy. config.redis.example.conf is a starting point.

# ==============================================================================
# HTTP Server
# ==============================================================================
# Listen address for relay traffic.
listen_addr: "0.0.0.0:8080"

# ==============================================================================
# Redis Configuration (REQUIRED)
# ==============================================================================
redis:
  # Connection URL. The scheme selects the client:
  #   redis:// or rediss:// (TLS)  a single Redis
  #   redis-sentinel://            Sentinel, e.g. "redis-sentinel://sentinel1:26379,sentinel2:26379/mymaster"
  #   redis-cluster://             Cluster, e.g. "redis-cluster://node1:6379,node2:6379,node3:6379"
  # A comma-separated host list under redis:// is NOT a cluster.
  url: "redis://localhost:6379"

  # Connection pool. Omit these to use the defaults.
  #
  # Default: sized from the relayer's worker pools, about 7.2 x GOMAXPROCS + 20.
  # Set it only to override that.
  # pool_size: 160
  #
  # Warm idle connections. Default: pool_size / 4.
  # min_idle_conns: 40
  #
  # Seconds a caller waits for a pooled connection. Default: 6.
  # pool_timeout_seconds: 6
  #
  # Close a connection idle for this many seconds. Default (unset or 0): 30
  # minutes, the Redis client library's own default.
  # conn_max_idle_time_seconds: 300

  # Batched relay publishing interval, in milliseconds. The batch is always on:
  # mined relays are written with one MULTI/EXEC per interval. 0 or absent means
  # the default, 1000. Any other value must be between 500 and 10000: below that
  # a batch stops being a batch, and above it the delay a served relay waits
  # before it is written starts to matter against the chain's block time.
  # batch_publish_interval_ms: 1000

  # How many MiB of mined relays the batch may hold before the relayer stops
  # admitting new relays (they are refused, never dropped once queued). 0 or
  # absent means the default, 512. Any other value must be between 64 and 8192.
  # batch_max_queued_mib: 512

  # Key namespace (optional). Only the base prefix is configurable. Every
  # segment below it is fixed, so miner and relayer cannot drift apart on the
  # key layout, and no family's SCAN pattern can match another family's keys.
  # Two base prefixes are two disjoint keyspaces: one Redis, several fleets.
  # It must not contain ':', whitespace, or the characters * ? [ ].
  # MUST be the same in the miner and every relayer of one fleet.
  #
  # The per-family prefixes (cache_prefix, events_prefix, streams_prefix,
  # miner_prefix, supplier_prefix, meter_prefix, params_prefix,
  # consumer_group_prefix) are RETIRED. Setting one to anything other than its
  # historical value fails at startup instead of silently relocating that
  # data -- see docs/REDIS.md.
  # namespace:
  #   # Root prefix for all keys. Default: "ha".
  #   base_prefix: "ha"

# ==============================================================================
# Pocket Blockchain Connection (REQUIRED)
# ==============================================================================
# The relayer receives block events from the miner through Redis. These
# endpoints serve chain queries (sessions, applications, services) and the
# startup health checks.
pocket_node:
  # CometBFT RPC endpoint. Production: your full node, e.g. "https://your-full-node:26657".
  query_node_rpc_url: "http://localhost:26657"

  # gRPC endpoint. Production: your full node, e.g. "your-full-node:9090".
  query_node_grpc_url: "localhost:9090"

  # Disable TLS for gRPC. Localnet: true. Production: false.
  grpc_insecure: true

# ==============================================================================
# Supplier Keys Configuration (REQUIRED)
# ==============================================================================
# Full reference: docs/SUPPLIER_KEYS.md
#
# keys_file and keyring are MUTUALLY EXCLUSIVE -- setting both is a startup
# error. Configure exactly one, so nothing has to decide at runtime which
# source wins a duplicate or what it means when one of them is unreadable.
keys:
  # Reload signing keys while the relayer runs, so adding or pulling a key takes
  # effect on a RUNNING relayer instead of only on the next restart.
  # Default: true.
  #
  # Every key source is covered. keys_file is also watched (its directory is
  # watched, which is what makes a Kubernetes secret's ..data swap register), so
  # a change there lands almost at once. A keyring cannot be watched, so its
  # changes are found by the reload timer instead -- within 30s. The relayer logs
  # which sources are watched and which rely on the timer at startup.
  hot_reload_enabled: true

  # Option 1: a YAML file of hex-encoded private keys (simple; suits testing).
  keys_file: "/keys/supplier-keys.yaml"

  # Option 2: a Cosmos SDK keyring (recommended for production). Remove
  # keys_file above when you enable this.
  # keyring:
  #   # "file" (passphrase-protected) or "test" (fixed password). "os" and
  #   # "memory" are refused at startup: "memory" starts empty and nothing
  #   # writes to it, and "os" depends on whether a system keychain is
  #   # reachable.
  #   backend: "file"
  #   # Directory CONTAINING the keyring; the file backend reads <dir>/keyring-file.
  #   dir: "/keys/keyring"
  #   app_name: "pocket"
  #   # For backend "file", say WHERE the passphrase is -- never the passphrase
  #   # itself, so the config stays non-sensitive. A mounted secret:
  #   passphrase_file: "/secrets/keyring-passphrase"
  #   # Or the NAME of an environment variable (mutually exclusive with
  #   # passphrase_file):
  #   ## passphrase_env: "KEYRING_PASSPHRASE"
  #   # With neither, it is read from stdin:
  #   #   echo "$SECRET" | pocket-relay-miner relayer --config config.yaml
  #   # which suits a terminal or a pipe, but not a container (stdin is /dev/null).
  #   # Optional: load only these keys (empty = load all).
  #   key_names:
  #     - "supplier1"
  #     - "supplier2"

# ==============================================================================
# Services (REQUIRED)
# ==============================================================================
# Map of service_id -> service configuration. The localnet genesis stakes 15
# suppliers on each develop-* service.
services:
  # HTTP/JSON-RPC service - multi-backend example.
  develop-http:
    validation_mode: eager
    timeout_profile: fast
    # Selects a per-service HTTP connection pool from pool_profiles below
    # (low / medium / high, or a name you define). Omit it to use the global
    # http_transport settings.
    pool_profile: low
    # 10 MiB. Both body directions fall back to this; see the body size
    # section below.
    max_body_size_bytes: 10485760
    # Backend used when a relay carries no Rpc-Type header. Default: jsonrpc.
    default_backend: jsonrpc
    backends:
      # Backends are keyed by TRANSPORT TYPE. The key must be exactly one of:
      #   jsonrpc | rest | websocket | grpc | cometbft
      # A relay is routed to a backend by exact type match, with NO fallback to
      # another type -- a websocket relay needs a `websocket:` backend with a
      # ws:// url, a grpc relay needs a `grpc:` backend, and so on. An unknown
      # key (e.g. `ws:` instead of `websocket:`) is rejected at startup.
      #
      # Each backend is health-checked independently.
      jsonrpc:
        # round_robin or first_healthy. Unset: round_robin with two or more
        # urls, first_healthy with one.
        load_balancing: round_robin
        # url (one backend) and urls (a pool) are mutually exclusive. A urls
        # entry is a plain URL or a {name, url} pair; the name is used in logs
        # and metrics.
        urls:
          - "http://backend:8545"
          - name: backup
            url: "http://backend-2:8545"
        # Retries of a failed backend request, 0 to 3. Default: 1.
        # max_retries: 1
        #
        # Seconds after which a backend tripped by the circuit breaker is
        # tried again. Prevents a pool with no active health checks from
        # staying down forever. Default: 30. 0 disables it, so only an active
        # health check can bring a backend back.
        # recovery_timeout_seconds: 30

  # WebSocket service.
  develop-websocket:
    validation_mode: eager
    timeout_profile: fast
    max_body_size_bytes: 10485760
    default_backend: websocket
    backends:
      websocket:
        url: "ws://backend:8545/ws"

  # Streaming/SSE service.
  develop-stream:
    validation_mode: eager
    # 10-minute request timeout, no response-header timeout.
    timeout_profile: streaming
    max_body_size_bytes: 10485760
    default_backend: rest
    backends:
      rest:
        url: "http://backend:8545/stream/sse"

  # gRPC service.
  develop-grpc:
    validation_mode: eager
    timeout_profile: fast
    max_body_size_bytes: 10485760
    default_backend: grpc
    backends:
      grpc:
        url: "backend:50051"

  # CometBFT service: RPC type 5, routed to the validator's CometBFT RPC.
  # CometBFT RPC is JSON-RPC over HTTP, so the backend is a plain HTTP endpoint.
  develop-cometbft:
    validation_mode: eager
    timeout_profile: fast
    max_body_size_bytes: 10485760
    default_backend: cometbft
    backends:
      cometbft:
        url: "http://validator:26657"

  # Template: a production JSON-RPC service with authentication, a JSON-RPC
  # health check (for a backend with no /health endpoint), a path prefix, and
  # its own body and validation-queue bounds.
  # evm-chain:
  #   validation_mode: optimistic
  #   pool_profile: medium
  #   # Per-service body bounds; each falls back to max_body_size_bytes, then
  #   # to the root defaults.
  #   max_request_body_size_bytes: 1048576
  #   max_response_body_size_bytes: 10485760
  #   # 0 or unset: default_validation_queue_max_mib. Otherwise 64 to 8192.
  #   validation_queue_max_mib: 256
  #   default_backend: jsonrpc
  #   backends:
  #     jsonrpc:
  #       url: "https://evm-node.example.com"
  #       # Path the backend expects on every request. It is prepended to a
  #       # request path that does not already start with it, and it wins over
  #       # any path in url/urls.
  #       base_path: "/ext/bc/C/rpc"
  #       # Headers sent on every request to this pool.
  #       headers:
  #         X-Custom-Header: "value"
  #       # One of: bearer_token ("Authorization: Bearer <token>"),
  #       # plain_token ("Authorization: <token>"), or username + password.
  #       authentication:
  #         bearer_token: "your-token"
  #         ## plain_token: "your-token"
  #         ## username: "user"
  #         ## password: "secret"
  #       # Active health checks (recommended for production).
  #       health_check:
  #         enabled: true
  #         # Probe path. Optional when base_path is set: the probe then uses
  #         # base_path.
  #         endpoint: "/"
  #         interval_seconds: 10
  #         timeout_seconds: 5
  #         unhealthy_threshold: 5
  #         healthy_threshold: 3
  #         # HTTP method. Default: GET. Use POST for a JSON-RPC probe.
  #         method: "POST"
  #         request_body: '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}'
  #         # Default: application/json when request_body starts with { or [.
  #         content_type: "application/json"
  #         # Substring the response body must contain. Unset: body not checked.
  #         expected_body: '"result"'
  #         # Accepted status codes. Unset: any 2xx.
  #         expected_status: [200]
  #         # Probe-only headers, merged over the pool headers above (probe
  #         # wins on conflict). Use for a health-check token not sent on
  #         # real relays.
  #         headers:
  #           X-Health-Token: "probe-only-secret"

  # Template: a long-running LLM service on the "streaming" timeout profile
  # (600s request timeout, no response-header timeout).
  # text-generation:
  #   validation_mode: eager
  #   timeout_profile: streaming
  #   backends:
  #     jsonrpc:
  #       url: "https://llm-backend.example.com"
  #       authentication:
  #         bearer_token: "your-api-key"

  # Template: a slow service on a custom timeout profile ("slow", defined in
  # the timeout_profiles template below), with a WebSocket backend beside the
  # JSON-RPC one.
  # slow-chain:
  #   validation_mode: optimistic
  #   timeout_profile: slow
  #   default_backend: jsonrpc
  #   backends:
  #     jsonrpc:
  #       url: "https://slow-chain.example.com"
  #     websocket:
  #       url: "wss://slow-chain.example.com/ws"

# ==============================================================================
# Service Defaults
# ==============================================================================
# Validation mode for services that do not set one: "eager" validates the relay
# before serving it, "optimistic" serves first and validates afterwards.
default_validation_mode: optimistic

# Fallback request timeout, in seconds, for a service whose timeout profile
# sets request_timeout_seconds to 0. It also takes part in sizing the relayer's
# own HTTP server read timeout (the largest timeout of any service). The
# timeout a service normally uses comes from its timeout profile.
default_request_timeout_seconds: 30

# Default max body size in bytes (10 MiB), used when a service sets none.
default_max_body_size_bytes: 10485760

# The two directions can be set apart. Either key unset inherits
# default_max_body_size_bytes above, so an existing config keeps its behaviour.
#
# They are not alike. A REQUEST body is held for the whole validation queue and
# then again inside the SMST leaf until the claim -- roughly forty blocks -- so
# it is what Redis is sized against. A RESPONSE is read, signed and dropped.
#
# Both accept a per-service override -- services.<id>.max_request_body_size_bytes
# and services.<id>.max_response_body_size_bytes (see the evm-chain template) --
# and both fall back to that service's max_body_size_bytes before reaching the
# defaults below.
#
# One value per key, the same for every RPC type: a service allows what it
# allows whether the relay arrives over JSON-RPC, REST, gRPC or a stream.
#
# The relayer logs both effective values and the key each came from at startup
# ("body size limits in force"). If the key you wrote is not the one named
# there, a more specific one is winning.
#
# HOW TO SIZE REDIS AGAINST THE REQUEST BOUND. A relay costs roughly 450 bytes
# of Redis that never change (the tree's interior nodes, the field name -- a
# digest in hex, so 96 bytes that cannot shrink -- and Redis's own per-entry
# overhead) PLUS the request payload. Only the payload grows. Over the ~40
# blocks a tree stays alive, a 12.8 GiB Redis therefore sustains roughly:
#
#   request payload    sustained rps
#   1 KB                     ~3,900
#   120 KB                      ~47
#   1 MB                         ~5.5
#   4 MB                         ~1.4
#
# Read those as orders of magnitude, not precise figures: more suppliers means
# more trees and more interior nodes, and a deployment with many suppliers has
# measured about 1.5x the per-relay cost.
#
# The rule: size Redis against (peak rps x average REQUEST size x 40 blocks).
# Raising the request bound does not only admit bigger requests -- it lowers
# the rps the same Redis can sustain, proportionally. Raising the RESPONSE
# bound costs bandwidth and relayer memory, and no Redis at all.
# default_max_request_body_size_bytes: 10485760
# default_max_response_body_size_bytes: 10485760

# How many MiB of request and response bodies EACH service's optimistic relays
# may hold between being served and being validated. Applies to every service
# that does not set its own validation_queue_max_mib.
#
# 0 MEANS THE DEFAULT (128), NOT UNLIMITED. Any other value must be between 64
# and 8192. There is no way to switch this off: an unbounded validation queue
# is what this bound exists to prevent.
#
# It is raised automatically when it is below what ONE relay of that service can
# retain, and the relayer says so at startup instead of refusing to boot.
#
# The relayer also prints, at startup, the SUM of these bounds against the
# memory it is allowed to use: with no global bound above them, that sum is the
# ceiling the validation queues can reach together.
# default_validation_queue_max_mib: 128

# ==============================================================================
# Relay Meter
# ==============================================================================
relay_meter:
  # TTL of the relay meter's per-session keys in Redis (the metering metadata,
  # the consumed-stake counters and the active-session markers). Redis expiry
  # cleans them up; no cleanup goroutine is needed. Default: 2h, which covers
  # several session lifecycles at a 60s block time.
  cache_ttl: 2h

# ==============================================================================
# Backend HTTP Transport
# ==============================================================================
# Connection pooling and timeouts for requests to backends. The defaults are
# sized for 1000+ RPS; override them for your backends. The values shown are
# the defaults.
http_transport:
  # Idle connections kept across all backends.
  max_idle_conns: 500
  # Idle connections kept per backend.
  max_idle_conns_per_host: 100
  # Connections per backend, active and idle. 0 = unlimited.
  max_conns_per_host: 500
  # Seconds an idle connection is kept alive.
  idle_conn_timeout_seconds: 90
  # Seconds to establish a new connection.
  dial_timeout_seconds: 5
  # Seconds for the TLS handshake.
  tls_handshake_timeout_seconds: 10
  # Seconds to wait for response headers.
  response_header_timeout_seconds: 30
  # Seconds to wait for a 100-continue response.
  expect_continue_timeout_seconds: 1
  # TCP keepalive period in seconds. 0 = disabled.
  tcp_keep_alive_seconds: 30
  # Leave the backend's content encoding untouched (required by the relay
  # protocol, which signs the exact bytes).
  disable_compression: true

# ==============================================================================
# Response Compression
# ==============================================================================
# gzip of the signed relay responses the relayer returns to its caller. It is
# off by default because gzip costs a measurable share of relayer CPU (in the
# order of 10% at a few hundred RPS), so the default prioritises CPU over
# bandwidth.
#
# When enabled, compression only actually runs when both:
#   - the client sent `Accept-Encoding: gzip`
#   - the response is at least `min_size_bytes` bytes long
# Below `min_size_bytes`, gzip overhead (header + dictionary + trailer)
# makes the output larger than the input for small JSON-RPC responses.
response_compression:
  enabled: false
  min_size_bytes: 1024

# ==============================================================================
# Timeout Profiles
# ==============================================================================
# A service selects one through its timeout_profile field (default: "fast").
# "fast" and "streaming" are built in with the values below; a profile you
# define is added to them, and redefining a built-in name replaces it. A
# profile's unset dial and TLS timeouts fall back to http_transport.
timeout_profiles:
  # Standard RPC services.
  fast:
    # Overall request timeout.
    request_timeout_seconds: 30
    # Seconds to wait for response headers.
    response_header_timeout_seconds: 30
    dial_timeout_seconds: 5
    tls_handshake_timeout_seconds: 10

  # Long-running services (LLMs, streams).
  streaming:
    request_timeout_seconds: 600
    # 0 = no response-header timeout, for streaming responses.
    response_header_timeout_seconds: 0
    dial_timeout_seconds: 10
    tls_handshake_timeout_seconds: 15

  # Template: a custom profile, used by the slow-chain service template.
  # slow:
  #   request_timeout_seconds: 60
  #   response_header_timeout_seconds: 60

# ==============================================================================
# Pool Profiles (per-service connection pools)
# ==============================================================================
# Each service gets its own HTTP client and connection pool, so one slow
# backend cannot starve healthy services of connections.
#
# A service selects one through its pool_profile field; with no pool_profile it
# uses the global http_transport settings. "low", "medium" and "high" are built
# in with the values below; a profile you define is added to them, and
# redefining a built-in name replaces it. A field left at 0 inherits the
# http_transport value.
#
# The built-in tiers were sized for a p99 of 100 ms or less. Measure your own
# backends with `scripts/loadtest/backends.sh sweep-optimal` to retune them.
pool_profiles:
  # Fast backends (p99 under 5 ms): requests complete so quickly that few
  # slots are ever in use; more slots only cost memory and file descriptors.
  low:
    max_conns_per_host: 10
    max_idle_conns_per_host: 5
    idle_conn_timeout_seconds: 90

  # Moderately latent backends (p99 in the tens of ms).
  medium:
    max_conns_per_host: 100
    max_idle_conns_per_host: 20
    idle_conn_timeout_seconds: 90

  # Slow backends that need many requests in flight to sustain their RPS (p99
  # in the hundreds of ms).
  high:
    max_conns_per_host: 250
    max_idle_conns_per_host: 50
    idle_conn_timeout_seconds: 90

# ==============================================================================
# Cache Warmup
# ==============================================================================
# Preload application data at startup so the first relays do not pay for it.
cache_warmup:
  # Default: true.
  enabled: true

  # Application addresses to preload, if you know them. This one is a localnet
  # genesis application.
  # known_applications:
  #   - "pokt1mrqt5f7qh8uxs27cjm9t7v9e74a9vvdnq5jva4"

  # Parallel warmup operations (higher = faster, more load). Default: 10.
  warmup_concurrency: 10

  # Seconds allowed to warm each application. Default: 5.
  warmup_timeout_seconds: 5

# ==============================================================================
# Observability Configuration
# ==============================================================================
# Prometheus metrics server.
metrics:
  enabled: true
  addr: "0.0.0.0:9090"

# pprof profiling server. Default: enabled on 127.0.0.1:6060 (loopback only:
# it serves heap and goroutine dumps). To reach it from outside the host or
# container, set addr explicitly, e.g. "0.0.0.0:6060", and firewall the port.
pprof:
  enabled: true
  addr: "127.0.0.1:6060"

# Health check server (/health and /ready).
health_check:
  enabled: true
  addr: "0.0.0.0:8081"

# The relayer does NOT apply logging defaults to fields left out of this block:
# without `async: true` it logs synchronously. Keep the block.
logging:
  # debug, info, warn or error; any other value fails config load.
  # Localnet uses debug. Production: info.
  level: "debug"
  # json or text. json is what a log pipeline can parse levels from. Logs go
  # to stderr.
  format: "json"
  # Non-blocking logging through a ring buffer; recommended.
  async: true
  # Ring buffer size, in log MESSAGES (not bytes). When it is full, the oldest
  # messages are dropped and the drop is reported.
  async_buffer_size: 100000
  # Milliseconds between flushes of the ring buffer. 10-50 for high-throughput
  # production.
  async_poll_interval: 100
  # Add caller file:line to each line (about 14% more allocations). Production:
  # false.
  enable_caller: false
  # GLOBAL log sampling for extreme throughput: it samples every component and
  # level alike, state-change logs included. Leave off unless log volume is a
  # measured problem.
  # sampling: false
  # Lines always written before sampling starts.
  # sampling_initial: 100
  # Then one line in N.
  # sampling_thereafter: 10

# ==============================================================================
# Simulated Relays (optional, disabled by default)
# ==============================================================================
# Serves synthetic relays for pinned (application, gateway-ring) identities,
# verified against config-pinned public keys instead of an on-chain session.
# SECURITY: app_pubkey_hex and every entry in gateway_pubkeys_hex are
# rejected at startup if they match the deterministic ring placeholder key
# (its private half is publicly derivable from a well-known seed) -- pinning
# it would let anyone forge simulated relays for that identity.
simulation:
  # Enable the simulated-relay feature. Default: false.
  enabled: false

  # Max simulated relays in flight across all identities. Default: 32.
  max_concurrent: 32

  # How old a simulated relay request's timestamp may be before it's
  # rejected as stale, in seconds. Default: 30.
  freshness_window_seconds: 30

  # Pinned simulated-relay identities. Each identity is served ONLY when
  # BOTH `simulation.enabled: true` above AND its own `enabled: true` are
  # set explicitly (fail-closed) - defaults do not turn identities on.
  #
  # No identities are pinned: the whole `identities` key is commented out
  # below, so the shipped example needs no edit to stay inert. The keys in
  # the template are illustrative and are NOT valid secp256k1 public keys -
  # a config carrying them is rejected at startup once `simulation.enabled`
  # is true. Generate your own dedicated simulation app and gateway key
  # pairs and pin their public halves here; see docs/SIMULATED_RELAYS.md
  # for the provisioning steps.
  #
  # TO PIN AN IDENTITY: delete the leading "# " (hash and one space) from
  # every line of the template below, then replace the placeholder keys.
  # Lines that are still comments after that single pass carry a second
  # "#" on purpose: they are OPTIONAL fields, and leaving them commented is
  # what keeps them unset. Uncomment only the ones you actually want.
  # identities:
  #     # Sent as the Pocket-Simulation-Key-Id header.
  #   - key_id: "my-sim-identity"
  #     # Per-identity switch (required to activate).
  #     enabled: true
  #
  #     # Compressed secp256k1 pubkey (hex, 33 bytes) of the simulated
  #     # application. Must be a real public key you generated.
  #     app_pubkey_hex: "02<64 hex chars>"
  #
  #     # Compressed secp256k1 pubkeys (hex) of the simulated gateway ring
  #     # members. At least one required. Keep their private halves in your
  #     # health-check tooling - never in this file.
