name: Release

on:
  push:
    branches:
      - dev      # Development builds → dev tag
      - main     # Release candidates → rc tag
    tags:
      - 'v*'     # Releases → version + latest; pre-releases (v1.0.0-rc.1) → version only

permissions:
  contents: write
  packages: write

jobs:
  metadata:
    name: Generate Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      build_date: ${{ steps.meta.outputs.build_date }}
      tags: ${{ steps.meta.outputs.tags }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version metadata
        id: meta
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "unknown")
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

          # Determine image tags based on ref type and branch
          PRERELEASE=false
          if [[ $GITHUB_REF == refs/tags/v*-* ]]; then
            # Pre-release tag (semver, e.g. v1.0.0-rc.1) → that tag only.
            # latest stays on the last release: a candidate is deployed by
            # its own tag, never picked up by whoever pulls latest.
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
            TAGS="ghcr.io/pokt-network/pocket-relay-miner:${VERSION_TAG}"
            PRERELEASE=true
            echo "🧪 Pre-release: ${VERSION_TAG}"
          elif [[ $GITHUB_REF == refs/tags/v* ]]; then
            # Git tag (e.g., v1.0.0) → the same tag, v included, + latest
            # Example: v1.0.0 → tags: v1.0.0, latest
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
            TAGS="ghcr.io/pokt-network/pocket-relay-miner:${VERSION_TAG},ghcr.io/pokt-network/pocket-relay-miner:latest"
            echo "🚀 Production Release: ${VERSION_TAG}"
          elif [[ $GITHUB_REF == refs/heads/main ]]; then
            # Main branch → version + rc tag
            # Example: main → tags: bd0f982, rc
            TAGS="ghcr.io/pokt-network/pocket-relay-miner:${VERSION},ghcr.io/pokt-network/pocket-relay-miner:rc"
            echo "📦 Release Candidate: ${VERSION}"
          elif [[ $GITHUB_REF == refs/heads/dev ]]; then
            # Dev branch → dev tag only (always latest dev)
            # Example: dev → tag: dev
            TAGS="ghcr.io/pokt-network/pocket-relay-miner:dev"
            echo "🔧 Development Build: ${VERSION}"
          else
            # Fallback for other branches
            BRANCH_NAME=$(echo $GITHUB_REF | sed 's|refs/heads/||')
            TAGS="ghcr.io/pokt-network/pocket-relay-miner:${BRANCH_NAME}-${VERSION}"
            echo "🌿 Branch Build: ${BRANCH_NAME}-${VERSION}"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "prerelease=${PRERELEASE}" >> $GITHUB_OUTPUT

  build-amd64:
    name: Build AMD64
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # BuildKit itself is an image; from the mirror, as the Dockerfile's are.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push AMD64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/pokt-network/pocket-relay-miner:${{ needs.metadata.outputs.version }}-amd64
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            COMMIT=${{ needs.metadata.outputs.commit }}
            BUILD_DATE=${{ needs.metadata.outputs.build_date }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
          labels: |
            org.opencontainers.image.title=pocket-relay-miner
            org.opencontainers.image.description=High-Availability RelayMiner for Pocket Network Shannon
            org.opencontainers.image.url=https://github.com/pokt-network/pocket-relay-miner
            org.opencontainers.image.source=https://github.com/pokt-network/pocket-relay-miner
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            org.opencontainers.image.created=${{ needs.metadata.outputs.build_date }}
            org.opencontainers.image.revision=${{ needs.metadata.outputs.commit }}
            org.opencontainers.image.licenses=MIT

  build-arm64:
    name: Build ARM64
    runs-on: ubuntu-24.04-arm
    needs: metadata
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # BuildKit itself is an image; from the mirror, as the Dockerfile's are.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ghcr.io/pokt-network/pocket-relay-miner:${{ needs.metadata.outputs.version }}-arm64
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            COMMIT=${{ needs.metadata.outputs.commit }}
            BUILD_DATE=${{ needs.metadata.outputs.build_date }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
          labels: |
            org.opencontainers.image.title=pocket-relay-miner
            org.opencontainers.image.description=High-Availability RelayMiner for Pocket Network Shannon
            org.opencontainers.image.url=https://github.com/pokt-network/pocket-relay-miner
            org.opencontainers.image.source=https://github.com/pokt-network/pocket-relay-miner
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            org.opencontainers.image.created=${{ needs.metadata.outputs.build_date }}
            org.opencontainers.image.revision=${{ needs.metadata.outputs.commit }}
            org.opencontainers.image.licenses=MIT

  create-manifest:
    name: Create Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: [metadata, build-amd64, build-arm64]
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          # Parse tags (comma-separated)
          IFS=',' read -ra TAG_ARRAY <<< "${{ needs.metadata.outputs.tags }}"

          # Create manifest for each tag
          for TAG in "${TAG_ARRAY[@]}"; do
            echo "Creating manifest for: $TAG"
            docker buildx imagetools create -t "$TAG" \
              ghcr.io/pokt-network/pocket-relay-miner:${{ needs.metadata.outputs.version }}-amd64 \
              ghcr.io/pokt-network/pocket-relay-miner:${{ needs.metadata.outputs.version }}-arm64
          done

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [metadata, create-manifest]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract the binaries from the published images
        run: |
          # The attached binaries are the ones inside the images, not a second
          # build: one recipe (the Dockerfile), the same bytes in both places.
          # The per-arch images are single-platform and never started, so the
          # arm64 one is read on this amd64 runner without emulation.
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          IMAGE=ghcr.io/pokt-network/pocket-relay-miner:${{ needs.metadata.outputs.version }}
          mkdir -p dist
          for ARCH in amd64 arm64; do
            id=$(docker create --platform "linux/${ARCH}" "${IMAGE}-${ARCH}")
            mkdir -p "dist/${ARCH}"
            docker cp "${id}:/usr/local/bin/pocket-relay-miner" "dist/${ARCH}/pocket-relay-miner"
            docker rm "${id}" >/dev/null
            file "dist/${ARCH}/pocket-relay-miner" | grep -q 'statically linked'
            tar -czf "dist/pocket-relay-miner_${TAG}_linux_${ARCH}.tar.gz" \
              --owner=0 --group=0 --numeric-owner -C "dist/${ARCH}" pocket-relay-miner
          done
          dist/amd64/pocket-relay-miner version | grep -F "${TAG}"
          (cd dist && sha256sum pocket-relay-miner_*.tar.gz > checksums.txt)

      - name: Skip if the release already exists
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A release created by hand, or a re-run of this job, keeps its notes:
          # the action below would replace the body with the image stub.
          # Only "release not found" means there is no release. Any other
          # failure (auth, network, rate limit, 5xx) stops the job: treating it
          # as "absent" would create a draft and overwrite hand-written notes.
          if err=$(gh release view "${GITHUB_REF#refs/tags/}" --repo "${{ github.repository }}" 2>&1 >/dev/null); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$err" | grep -q 'release not found'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "gh release view failed: $err" >&2
            exit 1
          fi

      - name: Find the commits since the previous release
        id: range
        if: steps.existing.outputs.exists == 'false'
        run: |
          # The notes list every commit since the previous vX.Y.Z reachable from
          # this tag. A pre-release tag never bounds the range: a release lists
          # what its candidates carried, and a candidate lists everything since
          # the release it follows. No previous release: all history.
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          PREV="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude 'v*-*' "${TAG}^" 2>/dev/null || true)"
          RANGE="${PREV:+${PREV}..}${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "range=${PREV:+${PREV}..${TAG}}" >> "$GITHUB_OUTPUT"
          echo "expected=$(git rev-list --count "${RANGE}")" >> "$GITHUB_OUTPUT"
          echo "notes range: ${RANGE}"

      - name: List the commits with git-cliff
        id: notes
        if: steps.existing.outputs.exists == 'false'
        # A failure here costs the commit list, never the release.
        continue-on-error: true
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.14.2
          config: cliff.toml
          args: --offline --tag ${{ steps.range.outputs.tag }} ${{ steps.range.outputs.range }}
        env:
          OUTPUT: RELEASE_COMMITS.md

      - name: Write the draft release body
        if: steps.existing.outputs.exists == 'false'
        env:
          NOTES_OUTCOME: ${{ steps.notes.outcome }}
          EXPECTED: ${{ steps.range.outputs.expected }}
        run: |
          # The release is created as a DRAFT. Its body starts with the commits
          # since the previous release, which the maintainer edits into the notes
          # before publishing, followed by the image references.
          #
          # The commit list is copied with cat and never passes through the
          # heredoc below: an unquoted heredoc expands $(...) and backticks, and
          # commit subjects carry backticks.
          set -euo pipefail
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          if [ "${NOTES_OUTCOME}" = success ] && [ -s RELEASE_COMMITS.md ]; then
            cat RELEASE_COMMITS.md > RELEASE_NOTES.md
            got="$(grep -c '^- ' RELEASE_COMMITS.md || true)"
            [ "${got}" = "${EXPECTED}" ] || echo "::warning::the commit list has ${got} entries for ${EXPECTED} commits in the range"
          else
            echo "::warning::git-cliff did not produce the commit list; the draft carries a pointer instead"
            echo '_Commit list not generated: write it from `git log` for this tag._' > RELEASE_NOTES.md
          fi
          cat >> RELEASE_NOTES.md << EOF

          ## Docker images

          \`\`\`bash
          docker pull ghcr.io/pokt-network/pocket-relay-miner:${CURRENT_TAG}
          \`\`\`

          Architecture-specific: \`ghcr.io/pokt-network/pocket-relay-miner:${CURRENT_TAG}-amd64\`, \`ghcr.io/pokt-network/pocket-relay-miner:${CURRENT_TAG}-arm64\`.

          Commit: ${{ needs.metadata.outputs.commit }} · Build date: ${{ needs.metadata.outputs.build_date }}
          EOF

      - name: Create GitHub Release
        if: steps.existing.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          draft: true
          prerelease: ${{ needs.metadata.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Runs on a re-run too: --clobber replaces the assets and leaves the
          # hand-written body alone.
          gh release upload "${GITHUB_REF#refs/tags/}" --repo "${{ github.repository }}" \
            --clobber dist/pocket-relay-miner_*.tar.gz dist/checksums.txt
