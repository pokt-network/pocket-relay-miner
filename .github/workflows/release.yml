name: Release

on:
  push:
    branches:
      - dev      # Development builds → dev tag
      - main     # Release candidates → rc tag
    tags:
      - 'v*'     # Production releases → version + latest tags

permissions:
  contents: write
  packages: write

jobs:
  metadata:
    name: Generate Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      build_date: ${{ steps.meta.outputs.build_date }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version metadata
        id: meta
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "unknown")
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

          # Determine image tags based on ref type and branch
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            # Git tag (e.g., v1.0.0) → the same tag, v included, + latest
            # Example: v1.0.0 → tags: v1.0.0, latest
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
            TAGS="ghcr.io/pokt-network/pocket-relay-miner:${VERSION_TAG},ghcr.io/pokt-network/pocket-relay-miner:latest"
            echo "🚀 Production Release: ${VERSION_TAG}"
          elif [[ $GITHUB_REF == refs/heads/main ]]; then
            # Main branch → version + rc tag
            # Example: main → tags: bd0f982, rc
            TAGS="ghcr.io/pokt-network/pocket-relay-miner:${VERSION},ghcr.io/pokt-network/pocket-relay-miner:rc"
            echo "📦 Release Candidate: ${VERSION}"
          elif [[ $GITHUB_REF == refs/heads/dev ]]; then
            # Dev branch → dev tag only (always latest dev)
            # Example: dev → tag: dev
            TAGS="ghcr.io/pokt-network/pocket-relay-miner:dev"
            echo "🔧 Development Build: ${VERSION}"
          else
            # Fallback for other branches
            BRANCH_NAME=$(echo $GITHUB_REF | sed 's|refs/heads/||')
            TAGS="ghcr.io/pokt-network/pocket-relay-miner:${BRANCH_NAME}-${VERSION}"
            echo "🌿 Branch Build: ${BRANCH_NAME}-${VERSION}"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

  build-amd64:
    name: Build AMD64
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push AMD64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/pokt-network/pocket-relay-miner:${{ needs.metadata.outputs.version }}-amd64
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            COMMIT=${{ needs.metadata.outputs.commit }}
            BUILD_DATE=${{ needs.metadata.outputs.build_date }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
          labels: |
            org.opencontainers.image.title=pocket-relay-miner
            org.opencontainers.image.description=High-Availability RelayMiner for Pocket Network Shannon
            org.opencontainers.image.url=https://github.com/pokt-network/pocket-relay-miner
            org.opencontainers.image.source=https://github.com/pokt-network/pocket-relay-miner
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            org.opencontainers.image.created=${{ needs.metadata.outputs.build_date }}
            org.opencontainers.image.revision=${{ needs.metadata.outputs.commit }}
            org.opencontainers.image.licenses=MIT

  build-arm64:
    name: Build ARM64
    runs-on: ubuntu-24.04-arm
    needs: metadata
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ghcr.io/pokt-network/pocket-relay-miner:${{ needs.metadata.outputs.version }}-arm64
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            COMMIT=${{ needs.metadata.outputs.commit }}
            BUILD_DATE=${{ needs.metadata.outputs.build_date }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
          labels: |
            org.opencontainers.image.title=pocket-relay-miner
            org.opencontainers.image.description=High-Availability RelayMiner for Pocket Network Shannon
            org.opencontainers.image.url=https://github.com/pokt-network/pocket-relay-miner
            org.opencontainers.image.source=https://github.com/pokt-network/pocket-relay-miner
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            org.opencontainers.image.created=${{ needs.metadata.outputs.build_date }}
            org.opencontainers.image.revision=${{ needs.metadata.outputs.commit }}
            org.opencontainers.image.licenses=MIT

  create-manifest:
    name: Create Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: [metadata, build-amd64, build-arm64]
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          # Parse tags (comma-separated)
          IFS=',' read -ra TAG_ARRAY <<< "${{ needs.metadata.outputs.tags }}"

          # Create manifest for each tag
          for TAG in "${TAG_ARRAY[@]}"; do
            echo "Creating manifest for: $TAG"
            docker buildx imagetools create -t "$TAG" \
              ghcr.io/pokt-network/pocket-relay-miner:${{ needs.metadata.outputs.version }}-amd64 \
              ghcr.io/pokt-network/pocket-relay-miner:${{ needs.metadata.outputs.version }}-arm64
          done

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [metadata, create-manifest]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Skip if the release already exists
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A release created by hand, or a re-run of this job, keeps its notes:
          # the action below would replace the body with the image stub.
          # Only "release not found" means there is no release. Any other
          # failure (auth, network, rate limit, 5xx) stops the job: treating it
          # as "absent" would create a draft and overwrite hand-written notes.
          if err=$(gh release view "${GITHUB_REF#refs/tags/}" --repo "${{ github.repository }}" 2>&1 >/dev/null); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$err" | grep -q 'release not found'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "gh release view failed: $err" >&2
            exit 1
          fi

      - name: Write the draft release body
        if: steps.existing.outputs.exists == 'false'
        run: |
          # The release is created as a DRAFT with only the image references.
          # Its notes are written by hand and published with the release's
          # attachments; a list generated from git log would replace them.
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          cat > RELEASE_NOTES.md << EOF
          ## Docker images

          \`\`\`bash
          docker pull ghcr.io/pokt-network/pocket-relay-miner:${CURRENT_TAG}
          \`\`\`

          Architecture-specific: \`ghcr.io/pokt-network/pocket-relay-miner:${CURRENT_TAG}-amd64\`, \`ghcr.io/pokt-network/pocket-relay-miner:${CURRENT_TAG}-arm64\`.

          Commit: ${{ needs.metadata.outputs.commit }} · Build date: ${{ needs.metadata.outputs.build_date }}
          EOF

      - name: Create GitHub Release
        if: steps.existing.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
