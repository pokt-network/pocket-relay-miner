name: CI

on:
  # main and develop only. A topic branch is covered by pull_request below, and
  # firing BOTH events for it is what produced a red X on green work: the two
  # runs share a concurrency group, so one gets cancelled, and GitHub attaches
  # the cancelled run's jobs to the PR's check list where they count as
  # non-success. Measured on PR #37: 8 passing jobs from the pull_request run,
  # plus 2 that finished and 6 that were cancelled from the push run -- the
  # "10 successful, 6 cancelled" a reviewer sees, with nothing having failed.
  push:
    branches: ["main", "develop"]
  # This filter matches the BASE branch. A PR stacked on another topic branch
  # never matched ["main", "develop"], so seven of the eleven stacked PRs ran no
  # CI at all and nobody noticed; the patterns below are what fixed that, and
  # they are the half that matters.
  pull_request:
    branches: ["main", "develop", "chore/**", "feat/**", "fix/**"]
  # Lets CI be re-run on any branch on demand, including a topic branch that has
  # no PR yet:
  #   gh workflow run CI --ref <branch>
  # GitHub reads this trigger from the DEFAULT branch only, which is why this
  # change has to land on main to have any effect anywhere else.
  workflow_dispatch:

permissions:
  contents: read

# Collapses SUCCESSIVE pushes to the same pull request, so only the newest run
# survives. It no longer has to collapse a push run against a pull_request run
# for the same commit -- the triggers above stop that pair from existing, which
# is the point: a cancelled run is indistinguishable from a failed one on the
# PR page. Both sides still name the branch the same way (github.ref_name is
# "chore/x" on a push, matching head.ref on the pull_request; github.ref would
# be "refs/heads/chore/x" and land in a second group).
#
# main never cancels: a run there is the record for a commit that is already
# merged, and losing it to a later push leaves that commit unverified.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  tracked-files:
    name: Tracked Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check no local-only files are tracked
        run: ./scripts/check-tracked-files.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true

      - name: Check formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted:"
            gofmt -s -l .
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true

      - name: Run tests
        run: make test

      - name: Run tests with coverage
        run: make test-coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true

      - name: Build binary
        run: make build

      - name: Verify version command
        run: ./bin/pocket-relay-miner version

  docker-build-amd64:
    name: Docker Build (AMD64)
    runs-on: ubuntu-latest
    needs: [lint, fmt, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract version metadata
        id: meta
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "unknown")
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

      - name: Build Docker image (AMD64)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: ghcr.io/pokt-network/pocket-relay-miner:test-amd64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

  docker-build-arm64:
    name: Docker Build (ARM64)
    runs-on: ubuntu-24.04-arm
    needs: [lint, fmt, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract version metadata
        id: meta
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "unknown")
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

      - name: Build Docker image (ARM64)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/arm64
          tags: ghcr.io/pokt-network/pocket-relay-miner:test-arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
